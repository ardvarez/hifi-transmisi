<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Panduan & Manual Book - PLN Transmisi Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --header-blue: #0b4884;
            --primary-blue: #0284c7;
            --primary-blue-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --purple-color: #9333ea;
        }

        body.dark-mode {
            background-color: #cbd5e1;
        }

        body.dark-mode .mobile-container {
            --bg-color: #0b1329;
            --card-bg: #1e293b;
            --header-blue: #0b4884;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            background-color: #0b1329;
            color: #f8fafc;
        }

        body.dark-mode .category-tabs-bar {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-mode .category-tab-pill {
            background: #0f172a;
            border-color: #334155;
            color: #94a3b8;
        }

        body.dark-mode .book-card {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-mode .book-title {
            color: #f8fafc !important;
        }

        body.dark-mode .book-desc {
            color: #94a3b8 !important;
        }

        body.dark-mode .chapters-box {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        body.dark-mode .btn-toggle-chapters {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.dark-mode .storage-notice-box {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            border-color: #334155 !important;
        }

        body.dark-mode .storage-text h4 {
            color: #38bdf8 !important;
        }

        body.dark-mode .storage-text p {
            color: #94a3b8 !important;
        }

        body.dark-mode .ios-bar {
            background: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        /* Mockup Container iPhone/Android Frame */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(20%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            background: var(--header-blue);
            z-index: 50;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 11px;
        }

        /* Activity Header Area */
        .activity-header {
            background: linear-gradient(135deg, var(--header-blue) 0%, #0369a1 100%);
            padding: 12px 18px 18px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(11, 72, 132, 0.25);
            z-index: 40;
            position: relative;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-back:active {
            transform: scale(0.92);
        }

        .header-title-box {
            flex: 1;
            margin-left: 12px;
        }

        .header-title-box h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .header-title-box p {
            font-size: 10.5px;
            color: #bae6fd;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Search Box in Header */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 12.5px;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .search-input::placeholder {
            color: #e0f2fe;
            font-weight: 500;
        }

        .search-input:focus {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #bae6fd;
            font-size: 13px;
            pointer-events: none;
        }

        /* Category Tabs Bar */
        .category-tabs-bar {
            background: #ffffff;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            z-index: 30;
        }

        .category-tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .category-tab-pill {
            padding: 6px 12px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .category-tab-pill.active {
            background: var(--header-blue);
            color: #ffffff;
            border-color: var(--header-blue);
            box-shadow: 0 2px 8px rgba(11, 72, 132, 0.25);
        }

        .category-tab-badge {
            font-size: 9.5px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            background: #e2e8f0;
            color: #475569;
        }

        .category-tab-pill.active .category-tab-badge {
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* Content Scroll Area */
        .books-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .books-summary-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: #64748b;
            font-weight: 600;
            margin: 2px 4px 2px;
        }

        .books-summary-bar strong {
            color: #0f172a;
        }

        /* Manual Book Card */
        .book-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .book-card:hover {
            border-color: #94a3b8;
        }

        .book-top-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .book-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .book-header-info {
            flex: 1;
            min-width: 0;
        }

        .book-tag-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .book-badge-tag {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .book-filesize {
            font-size: 10.5px;
            font-weight: 700;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .book-title {
            font-size: 13.5px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .book-desc {
            font-size: 11.5px;
            color: #475569;
            line-height: 1.45;
        }

        /* Chapter Topics Preview Accordion inside Card */
        .chapters-box {
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 8px 10px;
            font-size: 11px;
            color: #475569;
            display: none;
        }

        .chapters-box.open {
            display: block;
        }

        .chapters-list {
            margin: 6px 0 2px 16px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Meta Chips & Action Row */
        .book-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            gap: 8px;
        }

        .book-meta-text {
            font-size: 10.5px;
            color: #94a3b8;
            font-weight: 600;
        }

        .book-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toggle-chapters {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-download-pdf {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--primary-blue);
            background: var(--header-blue);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(11, 72, 132, 0.15);
        }

        .btn-download-pdf:active {
            transform: scale(0.95);
        }

        .btn-download-pdf.downloaded {
            background: #ecfdf5;
            border-color: #a7f3d0;
            color: #059669;
        }

        /* Storage Notice Box */
        .storage-notice-box {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .storage-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #ffffff;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.15);
        }

        .storage-text h4 {
            font-size: 12px;
            font-weight: 800;
            color: #0369a1;
            margin-bottom: 2px;
        }

        .storage-text p {
            font-size: 10.5px;
            color: #0c4a6e;
            line-height: 1.35;
        }

        .ios-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 110;
        }

        /* Toast Container */
        .mobile-toast {
            position: absolute;
            top: 50px;
            left: 20px;
            right: 20px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            transform: translateY(-80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .mobile-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    
        /* ========================================================
           UNIVERSAL PLN MOBILE DARK / NIGHT MODE SYSTEM
           ======================================================== */
        body.dark-mode {
            background-color: #cbd5e1;
        }

        body.dark-mode .mobile-container {
            --bg-color: #0b1329 !important;
            --bg-canvas: #0b1329 !important;
            --card-bg: #1e293b !important;
            --text-main: #f8fafc !important;
            --text-dark: #f8fafc !important;
            --text-muted: #94a3b8 !important;
            --text-sub: #94a3b8 !important;
            --border-color: #334155 !important;
            --input-bg: #0f172a !important;
            background-color: #0b1329 !important;
            color: #f8fafc !important;
        }

        /* Status Bar & Clean White Headers */
        body.dark-mode .header-section,
        body.dark-mode .header-white,
        body.dark-mode .app-header:not([style*="linear-gradient"]) {
            background: #0f172a !important;
            border-bottom-color: #334155 !important;
        }

        body.dark-mode .status-bar:not([style*="background: var(--header-blue)"]):not([style*="background-color: var(--header-blue)"]) {
            color: #f8fafc !important;
        }

        /* All Containers, Cards, Panels, Sheets, Modals, Tables */
        body.dark-mode .card,
        body.dark-mode .card-body,
        body.dark-mode .kpi-card,
        body.dark-mode .chart-card,
        body.dark-mode .quick-action-card,
        body.dark-mode .menu-card,
        body.dark-mode .jadwal-card,
        body.dark-mode .sync-card,
        body.dark-mode .summary-card,
        body.dark-mode .ers-detail-card,
        body.dark-mode .catalog-container-card,
        body.dark-mode .catalog-item-card,
        body.dark-mode .catalog-sheet-card,
        body.dark-mode .asset-card,
        body.dark-mode .bay-card,
        body.dark-mode .wo-card,
        body.dark-mode .survey-card,
        body.dark-mode .form-card,
        body.dark-mode .form-section,
        body.dark-mode .form-group-card,
        body.dark-mode .inspection-card,
        body.dark-mode .item-card,
        body.dark-mode .section-card,
        body.dark-mode .detail-card,
        body.dark-mode .list-card,
        body.dark-mode .filter-box,
        body.dark-mode .filter-container,
        body.dark-mode .filter-modal-content,
        body.dark-mode .catalog-modal-content,
        body.dark-mode .modal-drawer,
        body.dark-mode .modal-content,
        body.dark-mode .modal-box,
        body.dark-mode .popup-card,
        body.dark-mode .bottom-sheet,
        body.dark-mode .action-sheet,
        body.dark-mode .step-card,
        body.dark-mode .table-container,
        body.dark-mode .table-card,
        body.dark-mode .menu-grid-card,
        body.dark-mode .hero-card,
        body.dark-mode .kuota-card,
        body.dark-mode .sync-callout,
        body.dark-mode .help-section,
        body.dark-mode .help-item,
        body.dark-mode .notif-card,
        body.dark-mode .profile-user-card,
        body.dark-mode .profile-row-item,
        body.dark-mode .notif-toggle-row,
        body.dark-mode .map-view-card,
        body.dark-mode .book-card,
        body.dark-mode .faq-item-card,
        body.dark-mode .notif-card-large,
        body.dark-mode .empty-state-box,
        body.dark-mode .quick-action-btn {
            background: #1e293b !important;
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        /* Inner White/Light Elements inside Dark Cards */
        body.dark-mode div[style*="background: #ffffff"],
        body.dark-mode div[style*="background:#ffffff"],
        body.dark-mode div[style*="background: white"],
        body.dark-mode div[style*="background: #f8fafc"],
        body.dark-mode div[style*="background:#f8fafc"],
        body.dark-mode div[style*="background: #f1f5f9"],
        body.dark-mode div[style*="background:#f1f5f9"] {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        /* Inner Accent Soft Boxes */
        body.dark-mode div[style*="background: #eff6ff"],
        body.dark-mode div[style*="background:#eff6ff"] {
            background: #172554 !important;
            border-color: #1e40af !important;
            color: #93c5fd !important;
        }

        body.dark-mode div[style*="background: #fef3c7"],
        body.dark-mode div[style*="background:#fef3c7"] {
            background: #451a03 !important;
            border-color: #78350f !important;
            color: #fde68a !important;
        }

        body.dark-mode div[style*="background: #ecfdf5"],
        body.dark-mode div[style*="background:#ecfdf5"] {
            background: #064e3b !important;
            border-color: #047857 !important;
            color: #6ee7b7 !important;
        }

        body.dark-mode div[style*="background: #fef2f2"],
        body.dark-mode div[style*="background:#fef2f2"],
        body.dark-mode div[style*="background: #fee2e2"],
        body.dark-mode div[style*="background:#fee2e2"] {
            background: #450a0a !important;
            border-color: #991b1b !important;
            color: #fca5a5 !important;
        }

        /* All Form Inputs, Textareas, Selects */
        body.dark-mode input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
        body.dark-mode textarea,
        body.dark-mode select,
        body.dark-mode .form-control,
        body.dark-mode .form-input,
        body.dark-mode .form-select,
        body.dark-mode .input-box,
        body.dark-mode .search-input,
        body.dark-mode .filter-select,
        body.dark-mode .custom-select {
            background: #0f172a !important;
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder {
            color: #64748b !important;
        }

        /* Typography & Text */
        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4, body.dark-mode h5, body.dark-mode h6,
        body.dark-mode .main-title, body.dark-mode .card-title, body.dark-mode .section-title,
        body.dark-mode .item-title, body.dark-mode .catalog-title, body.dark-mode .kpi-label,
        body.dark-mode .form-label, body.dark-mode .field-label, body.dark-mode .label-text,
        body.dark-mode label, body.dark-mode strong {
            color: #f8fafc !important;
        }

        body.dark-mode p, body.dark-mode .sub-title, body.dark-mode .section-subtitle,
        body.dark-mode .item-sub, body.dark-mode .kpi-subtext, body.dark-mode .card-desc,
        body.dark-mode .text-muted, body.dark-mode .text-secondary, body.dark-mode .info-text,
        body.dark-mode .drawer-desc, body.dark-mode .profile-role, body.dark-mode .profile-item-sub,
        body.dark-mode .profile-group-label {
            color: #94a3b8 !important;
        }

        body.dark-mode div[style*="color: #1e293b"],
        body.dark-mode div[style*="color:#1e293b"],
        body.dark-mode div[style*="color: #0f172a"],
        body.dark-mode div[style*="color:#0f172a"],
        body.dark-mode span[style*="color: #1e293b"],
        body.dark-mode span[style*="color:#1e293b"],
        body.dark-mode span[style*="color: #0f172a"],
        body.dark-mode span[style*="color:#0f172a"] {
            color: #f8fafc !important;
        }

        body.dark-mode .kpi-value {
            color: #f8fafc !important;
        }

        body.dark-mode .grid-label {
            color: #cbd5e1 !important;
        }

        /* Buttons & Badges in Dark Mode */
        body.dark-mode .back-nav-btn,
        body.dark-mode .header-icon-btn,
        body.dark-mode .filter-btn,
        body.dark-mode .btn-secondary,
        body.dark-mode .btn-ghost {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        body.dark-mode .item-arrow-icon,
        body.dark-mode .kpi-arrow-icon,
        body.dark-mode .arrow-icon {
            color: #64748b !important;
        }

        body.dark-mode .filter-handle,
        body.dark-mode .catalog-handle,
        body.dark-mode .drawer-handle {
            background-color: #475569 !important;
        }

        /* Tabs & Segment Bars */
        body.dark-mode .segment-tab-bar,
        body.dark-mode .tabs-container,
        body.dark-mode .category-tabs-bar {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-mode .segment-tab-pill,
        body.dark-mode .category-tab-pill,
        body.dark-mode .tab-item {

        body.dark-mode .segment-tab-pill.active,

        /* Bottom Navbars */

<body>

    <div class="mobile-container">

        <!-- Category Filter Tabs Bar -->

            <div class="category-tab-pill" onclick="switchBookCategory('k3', this)">

                <span>K3 & SOP</span>
                <span class="category-tab-badge">1</span>
            </div>
        </div>

        <!-- Books Content Area -->
        <div class="books-content-area" id="booksContentArea">
            <!-- Populated dynamically by JS -->
        </div>

        <!-- iOS Bottom Bar Line -->
        <div class="ios-bar"></div>

        <!-- In-App Toast -->
        <div class="mobile-toast" id="mobileToast">
            <i class="fa-solid fa-circle-check" style="color: #4ade80; font-size: 16px;"></i>
            <span id="toastMessage">Dokumen berhasil diunduh</span>
        </div>
    </div>

    <script>
        /* Comprehensive Manual Books Dataset */
        const manualBooksData = [
            {
                id: 'mb-1',
                app: 'inspeksi',
                title: 'Buku Panduan Power Inspect Mobile v2.4',
                desc: 'Petunjuk lengkap inspeksi level 1 harian, thermovisi CBM bay trafo, input anomali, serta troubleshooting sinkronisasi data offline.',
                badge: 'Power Inspect',
                badgeBg: '#eff6ff',
                badgeColor: '#2563eb',
                icon: 'fa-clipboard-check',
                size: '4.2 MB',
                version: 'v2.4.0',
                pages: '48 Halaman',
                date: '31 Agu 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Pengenalan Tampilan & Login Akun Personal / SSO',
                    'Bab 2: Tata Cara Unduh Formulir & Jadwal Harian Offline',
                    'Bab 3: Standar Pengukuran Thermovisi FLIR & Anomali TBT',
                    'Bab 4: Pengisian Checklist Bay Trafo, Line, & Koppel 150kV',
                    'Bab 5: Sinkronisasi Data Hasil Inspeksi & Kuota Upload'
                ]
            },
            {
                id: 'mb-2',
                app: 'inspeksi',
                title: 'Pedoman Standar Anomali & Kriteria Kelaikan CBM',
                desc: 'Buku saku kriteria grading deviasi suhu klem busbar, kebocoran minyak trafo, tekanan gas SF6 GIS, dan batas ambang getaran.',
                badge: 'Power Inspect',
                badgeBg: '#eff6ff',
                badgeColor: '#2563eb',
                icon: 'fa-triangle-exclamation',
                size: '2.8 MB',
                version: 'v1.5.0',
                pages: '32 Halaman',
                date: '10 Agu 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Klasifikasi Delta Temperatur CBM (Normal, Waspada, Kritis)',
                    'Bab 2: Ambang Batas Tekanan Gas SF6 pada GIS & PMT',
                    'Bab 3: Kriteria Visual Isolator Flashover & Polusi Berat'
                ]
            },
            {
                id: 'mb-3',
                app: 'ers',
                title: 'Manual Book ERS (Emergency Restoration System)',
                desc: 'Standar Operasional Prosedur penanganan tower roboh, permohonan mutasi tower darurat, perakitan mast base, dan stock opname material.',
                badge: 'ERS Mobile',
                badgeBg: '#f3e8ff',
                badgeColor: '#9333ea',
                icon: 'fa-tower-observation',
                size: '6.8 MB',
                version: 'v1.8.2',
                pages: '64 Halaman',
                date: '15 Jul 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Alur Disposisi Mutasi Tower Darurat Antar-UPT',
                    'Bab 2: Perakitan Komponen Mast Base, Guy Wire, & Gin Pole',
                    'Bab 3: Prosedur Stringing Konduktor & Penarikan Kawat SUTT',
                    'Bab 4: Stock Opname & Form Berita Acara Gudang Regional'
                ]
            },
            {
                id: 'mb-4',
                app: 'ers',
                title: 'SOP Pembongkaran & Karantina Komponen ERS',
                desc: 'Instruksi kerja dismantling tower darurat, uji kelayakan guy wire pasca-operasi, dan prosedur karantina material rusak.',
                badge: 'ERS Mobile',
                badgeBg: '#f3e8ff',
                badgeColor: '#9333ea',
                icon: 'fa-truck-ramp-box',
                size: '3.6 MB',
                version: 'v1.3.0',
                pages: '28 Halaman',
                date: '02 Jun 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Prosedur Dismantling & Rekondisi Tapak Tower',
                    'Bab 2: Karantina & Uji Tarik Komponen Guy Wire',
                    'Bab 3: Input Berita Acara Pengembalian ke Gudang'
                ]
            },
            {
                id: 'mb-5',
                app: 'ffe',
                title: 'Petunjuk Teknis FFE (Fire Fighting Equipment)',
                desc: 'Panduan inspeksi berkala tabung APAR CO2/Powder, uji kelaikan pompa hydrant switchyard, dan sensor flame detector ruang kontrol.',
                badge: 'FFE Transmisi',
                badgeBg: '#fee2e2',
                badgeColor: '#dc2626',
                icon: 'fa-fire-extinguisher',
                size: '3.1 MB',
                version: 'v1.2.0',
                pages: '36 Halaman',
                date: '20 Jun 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Checklist Pemeriksaan Tekanan & Jarum Manometer APAR',
                    'Bab 2: Uji Running Pompa Hydrant Diesel & Electric GI',
                    'Bab 3: Masa Uji Hydrostatic Test 3 Tahunan Tabung Gas CO2'
                ]
            },
            {
                id: 'mb-6',
                app: 'survey',
                title: 'Panduan Penggunaan SURVEY Mobile Transmisi',
                desc: 'Tata cara permohonan survei lapangan baru, survei ketersediaan ruang bay GI Senayan/Mampang, dan survei kebutuhan riset tanah tower.',
                badge: 'SURVEY Mobile',
                badgeBg: '#d1fae5',
                badgeColor: '#059669',
                icon: 'fa-compass-drafting',
                size: '5.5 MB',
                version: 'v1.0.4',
                pages: '52 Halaman',
                date: '28 Agu 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Prosedur Pengajuan Permintaan Survei Lapangan Baru',
                    'Bab 2: Formulir Survei Ketersediaan Lahan & Kapasitas Bay GI',
                    'Bab 3: Survei Kebutuhan Riset & Pengujian Geoteknik Pondasi Tower',
                    'Bab 4: Input Titik Koordinat GPS & Geotagging Pohon Kritis ROW'
                ]
            },
            {
                id: 'mb-7',
                app: 'k3',
                title: 'Pedoman Keselamatan Kerja (K3) Switchyard & KHS',
                desc: 'Buku standar Keselamatan dan Kesehatan Kerja (K3), penggunaan APD lengkap, izin manuver tegangan tinggi 150/500kV, & zonasi bahaya induksi.',
                badge: 'K3 Transmisi',
                badgeBg: '#fef3c7',
                badgeColor: '#d97706',
                icon: 'fa-helmet-safety',
                size: '2.9 MB',
                version: 'K3-2026',
                pages: '40 Halaman',
                date: '10 Mei 2026',
                downloaded: false,
                chapters: [
                    'Bab 1: Standar APD Wajib (Helm K3, Sepatu 20kV, Rompi Reflektor)',
                    'Bab 2: Prosedur Working Permit & Lock Out Tag Out (LOTO)',
                    'Bab 3: Jarak Bebas Aman (Clearance) Tegangan 150kV & 500kV',
                    'Bab 4: Tanggap Darurat Medis & Pertolongan Pertama di GI'
                ]
            }
        ];

        let currentCategory = 'all';
        let currentSearch = '';

        function renderBooksList() {
            const container = document.getElementById('booksContentArea');
            if (!container) return;

            let filtered = manualBooksData.filter(item => {
                if (currentCategory !== 'all' && item.app !== currentCategory) return false;
                if (currentSearch.trim() !== '') {
                    const q = currentSearch.toLowerCase();
                    const matchTitle = item.title.toLowerCase().includes(q);
                    const matchDesc = item.desc.toLowerCase().includes(q);
                    const matchBadge = item.badge.toLowerCase().includes(q);
                    if (!matchTitle && !matchDesc && !matchBadge) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: #ffffff; border-radius: 18px; border: 1px dashed #cbd5e1; margin-top: 6px;">
                        <i class="fa-regular fa-folder-open" style="font-size: 32px; color: #94a3b8; margin-bottom: 8px;"></i>
                        <h4 style="font-size: 13.5px; font-weight: 800; color: #1e293b; margin-bottom: 4px;">Dokumen Tidak Ditemukan</h4>
                        <p style="font-size: 11px; color: #64748b; max-width: 260px; margin: 0 auto;">Tidak ada buku panduan yang cocok dengan kata kunci "${currentSearch}".</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="books-summary-bar">
                    <span>Menampilkan <strong>${filtered.length} Dokumen PDF</strong></span>
                    <span>${currentSearch.trim() !== '' ? 'Hasil Pencarian' : getCategoryTitle(currentCategory)}</span>
                </div>
            `;

            filtered.forEach(book => {
                html += `
                    <div class="book-card" id="bookCard_${book.id}">
                        <div class="book-top-row">
                            <div class="book-icon-box" style="background: ${book.badgeBg}; color: ${book.badgeColor};">
                                <i class="fa-solid ${book.icon}"></i>
                            </div>
                            <div class="book-header-info">
                                <div class="book-tag-row">
                                    <span class="book-badge-tag" style="background: ${book.badgeBg}; color: ${book.badgeColor};">${book.badge}</span>
                                    <span class="book-filesize">
                                        <i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i> ${book.size}
                                    </span>
                                </div>
                                <div class="book-title">${book.title}</div>
                                <div class="book-desc">${book.desc}</div>
                            </div>
                        </div>

                        <!-- Expandable Chapters Box -->
                        <div class="chapters-box" id="chapters_${book.id}">
                            <div style="font-size: 10.5px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;">
                                <i class="fa-solid fa-list-check" style="color: var(--primary-blue);"></i> Daftar Bab & Materi Pembahasan:
                            </div>
                            <ol class="chapters-list">
                                ${book.chapters.map(ch => `<li>${ch}</li>`).join('')}
                            </ol>
                        </div>

                        <div class="book-footer-row">
                            <div class="book-meta-text">
                                ${book.version} • ${book.pages}
                            </div>
                            <div class="book-actions-group">
                                <button class="btn-toggle-chapters" onclick="toggleChapters('${book.id}', this)" title="Lihat Bab">
                                    <span>Detail Isi</span>
                                    <i class="fa-solid fa-chevron-down" style="font-size: 9px;"></i>
                                </button>
                                <button class="btn-download-pdf ${book.downloaded ? 'downloaded' : ''}" onclick="triggerDownload('${book.id}', '${book.title}', '${book.size}')" id="btnDl_${book.id}">
                                    <i class="fa-solid ${book.downloaded ? 'fa-circle-check' : 'fa-cloud-arrow-down'}"></i>
                                    <span>${book.downloaded ? 'Tersimpan' : 'Unduh PDF'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Storage Notice Box at bottom
            html += `
                <div class="storage-notice-box">
                    <div class="storage-icon">
                        <i class="fa-solid fa-folder-arrow-down"></i>
                    </div>
                    <div class="storage-text">
                        <h4>Penyimpanan Dokumen Offline</h4>
                        <p>Dokumen yang telah diunduh tersimpan otomatis di perangkat Anda dan dapat diakses tanpa koneksi internet.</p>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function getCategoryTitle(key) {
            const map = {
                all: 'Semua Panduan',
                inspeksi: 'Power Inspect',
                ers: 'ERS Mobile',
                ffe: 'FFE Transmisi',
                survey: 'SURVEY Mobile',
                k3: 'K3 & SOP'
            };
            return map[key] || 'Katalog Panduan';
        }

        function switchBookCategory(catKey, el) {
            currentCategory = catKey;
            currentSearch = '';
            const searchInput = document.getElementById('manualSearchInput');
            if (searchInput) searchInput.value = '';

            const pills = document.querySelectorAll('#categoryTabsBar .category-tab-pill');
            pills.forEach(p => p.classList.remove('active'));
            if (el) el.classList.add('active');

            renderBooksList();
        }

        function handleBookSearch(val) {
            currentSearch = val;
            renderBooksList();
        }

        function toggleChapters(id, btn) {
            const box = document.getElementById(`chapters_${id}`);
            if (box) {
                const isOpen = box.classList.contains('open');
                box.classList.toggle('open');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.className = isOpen ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
                }
            }
        }

        function triggerDownload(id, title, size) {
            const book = manualBooksData.find(b => b.id === id);
            if (book) {
                showToast(`Mengunduh ${title} (${size})...`, 'fa-cloud-arrow-down', '#38bdf8');
                setTimeout(() => {
                    book.downloaded = true;
                    renderBooksList();
                    showToast(`Berhasil mengunduh ${title}`, 'fa-circle-check', '#4ade80');
                }, 1400);
            }
        }

        function showToast(msg, icon = 'fa-circle-check', color = '#4ade80') {
            const toast = document.getElementById('mobileToast');
            const toastMsg = document.getElementById('toastMessage');
            if (toast && toastMsg) {
                toast.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}; font-size:16px;"></i> <span>${msg}</span>`;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2800);
            }
        }

        // Initialize on load
        function initTheme() {
            if (localStorage.getItem('pln_mobile_theme') === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderBooksList();
        });
        initTheme();
        renderBooksList();
    </script>
</body>

</html>
