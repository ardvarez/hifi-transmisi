<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detail Komponen ERS - PLN Power Inspect</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet CSS for Map Modal -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --card-bg: #ffffff;
            --primary-blue: #0A58CA;
            --primary-blue-dark: #084298;
            --primary-blue-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --danger-red: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --warning-amber: #d97706;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
            --success-green: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* 1. iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 6px;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 20;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* 2. Top Header (Action home removed, back button only) */
        .header-section {
            background: #ffffff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 20;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .title-with-back {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }

        .back-home-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .back-home-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .main-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .sub-title {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 42px;
        }

        /* 3. App Body / Content Area */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 14px 16px 20px;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-canvas);
            scrollbar-width: none;
            gap: 12px;
        }

        .app-body::-webkit-scrollbar {
            display: none;
        }

        /* Meta Spec Card */
        .meta-spec-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.85);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-row {
            display: flex;
            font-size: 12px;
            line-height: 1.4;
        }

        .meta-lbl {
            width: 75px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .meta-val {
            font-weight: 700;
            color: var(--text-dark);
        }

        .meta-note {
            font-size: 10.5px;
            color: var(--warning-amber);
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 2px;
            line-height: 1.35;
        }

        .meta-actions-row {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-top-action {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-top-action.loc {
            background: var(--primary-blue-light);
            border: 1px solid #bfdbfe;
            color: var(--primary-blue);
        }

        .btn-top-action.loc:hover {
            background: #dbeafe;
        }

        .btn-top-action.excel {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-green);
        }

        .btn-top-action.excel:hover {
            background: #dcfce7;
        }

        /* Set Switcher Segmented Pills (Set 1 to Set 4) */
        .set-pills-bar {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .set-pill-btn {
            background: transparent;
            border: none;
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.15s ease;
        }

        .set-pill-btn.active {
            background: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(10, 88, 202, 0.25);
        }

        .set-pill-sub {
            font-size: 9px;
            font-weight: 600;
            opacity: 0.85;
        }

        .set-pill-btn.active .set-pill-sub {
            opacity: 1;
        }

        /* Filter Status Pills */
        .filter-status-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-status-row::-webkit-scrollbar {
            display: none;
        }

        .filter-btn-pill {
            padding: 6px 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .filter-btn-pill.active {
            background: var(--primary-blue);
            color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(10, 88, 202, 0.25);
        }

        /* Component Cards List */
        .components-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comp-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.15s ease;
        }

        .comp-card.shortage {
            border-left: 4px solid var(--danger-red);
        }

        .comp-card.safe {
            border-left: 4px solid var(--success-green);
        }

        .comp-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .comp-tags-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .comp-section-tag {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* Type A / Type B Pill Badge */
        .comp-type-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 0.2px;
        }

        .comp-type-badge.type-a {
            background: #eff6ff;
            color: #0A58CA;
            border: 1px solid #bfdbfe;
        }

        .comp-type-badge.type-b {
            background: #fdf4ff;
            color: #9333ea;
            border: 1px solid #f5d0fe;
        }

        .comp-mandatory-badge {
            font-size: 10px;
            font-weight: 800;
            color: #0284c7;
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .comp-catalog-name {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.35;
        }

        .comp-catalog-name.mandatory {
            color: #0284c7;
        }

        /* 2x2 Metric Grid */
        .comp-metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
        }

        .comp-metric-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .metric-title {
            font-size: 8.5px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .metric-number {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-number.danger {
            color: var(--danger-red);
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            border-radius: 6px;
            padding: 1px 2px;
        }

        .metric-number.safe {
            color: var(--success-green);
        }

        .comp-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px dashed var(--border-color);
            gap: 8px;
        }

        .loc-chip-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }

        .loc-chip {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #dbeafe;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .multi-loc-badge {
            font-size: 10px;
            font-weight: 700;
            background: #ffedd5;
            color: #ea580c;
            border: 1px solid #fed7aa;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .btn-pin-loc {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .btn-pin-loc:hover {
            background: var(--primary-blue);
            color: #ffffff;
            border-color: var(--primary-blue);
        }

        /* iOS Bottom Indicator */
        .ios-bar {
            width: 134px;
            height: 5px;
            background-color: #cbd5e1;
            border-radius: 10px;
            margin: 8px auto 6px auto;
            flex-shrink: 0;
        }

        /* Map Bottom Sheet Modal */
        .map-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: 99;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .map-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .map-modal-sheet {
            background: #ffffff;
            border-radius: 22px 22px 0 0;
            padding: 16px 18px 24px;
            height: 72%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
        }

        .map-modal-overlay.active .map-modal-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 4px;
            margin: 0 auto 4px;
        }

        .modal-map-view {
            width: 100%;
            flex: 1;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            z-index: 1;
        }

        /* Custom Warehouse Leaflet Pin Marker */
        .custom-warehouse-pin {
            background: transparent;
            border: none;
        }

        .warehouse-marker-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0A58CA;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(10, 88, 202, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .warehouse-marker-bubble.multi {
            background: #ea580c;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.45);
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <!-- 1. iOS Status Bar -->
        <div class="status-bar">
            <span id="currentTime">09:41</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- 2. Standard Header Section (Action home removed, back button only) -->
        <div class="header-section">
            <div class="header-titles">
                <div class="title-with-back">
                    <a href="./detail-ers-tidak-lengkap.html" class="back-home-btn" id="backBtn" onclick="if(window.history.length>1){window.history.back(); return false;}" title="Kembali">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div class="main-title" id="pageMainTitle">Detail Komponen ERS</div>
                </div>
                <div class="sub-title" id="pageSubTitle">PPB • Merk SBB</div>
            </div>
        </div>

        <!-- 3. App Body / Content Area -->
        <div class="app-body">
            <!-- Meta Spec Box -->
            <div class="meta-spec-card">
                <div class="meta-row">
                    <span class="meta-lbl">Merk</span>
                    <span class="meta-val" id="metaMerkVal">: SBB</span>
                </div>
                <div class="meta-row">
                    <span class="meta-lbl">Template</span>
                    <span class="meta-val" id="metaTemplateVal">: SBB - TENSION - 150 kV (2X42M)</span>
                </div>
                <div class="meta-note">
                    <i class="fa-solid fa-circle-info"></i>
                    Item biru = <strong>Mandatory</strong>, angka merah = <strong>defisit/kurang</strong>.
                </div>
                <div class="meta-actions-row">
                    <button type="button" class="btn-top-action loc" onclick="openAllLocationsMap()">
                        <i class="fa-solid fa-warehouse"></i> Lihat Penempatan
                    </button>
                    <button type="button" class="btn-top-action excel" onclick="alert('Export data Excel komponen berhasil diunduh.')">
                        <i class="fa-solid fa-file-excel"></i> Export Excel
                    </button>
                </div>
            </div>

            <!-- Segmented Set Switcher (Set 1 to Set 4) -->
            <div class="set-pills-bar">
                <button type="button" class="set-pill-btn" onclick="selectSet(1, this)">
                    <span>Set 1</span>
                    <span class="set-pill-sub" id="badgeSet1">Aman</span>
                </button>
                <button type="button" class="set-pill-btn active" onclick="selectSet(2, this)">
                    <span>Set 2</span>
                    <span class="set-pill-sub" id="badgeSet2">3 Defisit</span>
                </button>
                <button type="button" class="set-pill-btn" onclick="selectSet(3, this)">
                    <span>Set 3</span>
                    <span class="set-pill-sub" id="badgeSet3">8 Defisit</span>
                </button>
                <button type="button" class="set-pill-btn" onclick="selectSet(4, this)">
                    <span>Set 4</span>
                    <span class="set-pill-sub" id="badgeSet4">9 Defisit</span>
                </button>
            </div>

            <!-- Quick Status Filter Pills -->
            <div class="filter-status-row">
                <button type="button" class="filter-btn-pill active" onclick="filterByDeficit('all', this)">Semua (9)</button>
                <button type="button" class="filter-btn-pill" onclick="filterByDeficit('deficit', this)">🔴 Defisit / Kurang (<span id="countDeficit">6</span>)</button>
                <button type="button" class="filter-btn-pill" onclick="filterByDeficit('safe', this)">🟢 Aman (<span id="countSafe">3</span>)</button>
            </div>

            <!-- Component Cards List -->
            <div class="components-list" id="componentsListContainer">
                <!-- Dynamically rendered via JS -->
            </div>
        </div>

        <!-- iOS Bottom Indicator -->
        <div class="ios-bar"></div>

        <!-- Map Bottom Sheet Modal (Warehouse Locations) -->
        <div class="map-modal-overlay" id="mapModalSheet" onclick="closeMapModal(event)">
            <div class="map-modal-sheet" onclick="event.stopPropagation()">
                <div class="sheet-handle"></div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size:14px; font-weight:800; color:var(--text-dark);" id="mapModalLocTitle">Lokasi Gudang Penyimpanan</div>
                        <span style="font-size:11px; color:var(--text-muted);" id="mapModalLocSub">Titik penempatan material standby ERS</span>
                    </div>
                    <button type="button" onclick="closeMapModalDirect()" style="border:none; background:#f1f5f9; width:30px; height:30px; border-radius:50%; font-size:12px; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center;">✕</button>
                </div>
                <div class="modal-map-view" id="modalMap"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

        let activeSetNumber = 2; // Default Set 2
        let activeDeficitFilter = 'all'; // 'all' | 'deficit' | 'safe'
        let modalMapInstance = null;

        function renderComponents() {
            const container = document.getElementById('componentsListContainer');

            // Count summary for current set
            let deficitCount = 0;
            let safeCount = 0;

            componentsData.forEach(item => {
                const sisa = item.sets[activeSetNumber].sisa;
                if (sisa < 0) deficitCount++;
                else safeCount++;
            });

            document.getElementById('countDeficit').innerText = deficitCount;
            document.getElementById('countSafe').innerText = safeCount;

            // Filter data
            const filtered = componentsData.filter(item => {
                const sisa = item.sets[activeSetNumber].sisa;
                if (activeDeficitFilter === 'deficit') return sisa < 0;
                if (activeDeficitFilter === 'safe') return sisa >= 0;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px 10px; color: var(--text-muted);">
                        <i class="fa-solid fa-circle-check" style="font-size:32px; color:var(--success-green); margin-bottom:10px;"></i>
                        <p style="font-size:13px; font-weight:700; color:var(--text-dark);">Tidak ada komponen defisit pada Set ${activeSetNumber}!</p>
                        <p style="font-size:11.5px;">Semua komponen dalam status kuantiti aman.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const curSet = item.sets[activeSetNumber];
                const isShortage = curSet.sisa < 0;
                const isMultiLoc = item.lokasiList.length > 1;
                const locSummary = isMultiLoc 
                    ? `${item.lokasiList[0].nama} (+${item.lokasiList.length - 1} Gudang)`
                    : item.lokasiList[0].nama;

                return `
                    <div class="comp-card ${isShortage ? 'shortage' : 'safe'}">
                        <div class="comp-card-head">
                            <div class="comp-tags-left">
                                <span class="comp-section-tag">${item.bagian}</span>
                                <span class="comp-type-badge ${item.tipe === 'Type A' ? 'type-a' : 'type-b'}">${item.tipe}</span>
                            </div>
                            ${item.isMandatory ? `
                                <span class="comp-mandatory-badge"><i class="fa-solid fa-star"></i> Mandatory</span>
                            ` : ''}
                        </div>

                        <div class="comp-catalog-name ${item.isMandatory ? 'mandatory' : ''}">
                            ${item.katalog}
                        </div>

                        <!-- 2x2 Metric Grid -->
                        <div class="comp-metrics-grid">
                            <div class="comp-metric-box">
                                <span class="metric-title">Standar 1 Set</span>
                                <span class="metric-number">${item.standar1Set}</span>
                            </div>
                            <div class="comp-metric-box">
                                <span class="metric-title">Stock Standby</span>
                                <span class="metric-number">${item.stockStandby}</span>
                            </div>
                            <div class="comp-metric-box">
                                <span class="metric-title">Pakai (Set ${activeSetNumber})</span>
                                <span class="metric-number">${curSet.used}</span>
                            </div>
                            <div class="comp-metric-box">
                                <span class="metric-title">Sisa Set ${activeSetNumber}</span>
                                <span class="metric-number ${isShortage ? 'danger' : 'safe'}">
                                    ${curSet.sisa}
                                </span>
                            </div>
                        </div>

                        <div class="comp-card-footer">
                            <div class="loc-chip-wrap">
                                <div class="loc-chip" title="${item.lokasiList.map(l => l.nama).join(', ')}">
                                    <i class="fa-solid fa-warehouse"></i> ${locSummary}
                                </div>
                                ${isMultiLoc ? `<span class="multi-loc-badge">${item.lokasiList.length} Titik Gudang</span>` : ''}
                            </div>
                            <button class="btn-pin-loc" type="button" onclick="openCompLocationsMap(${item.no})" title="Lihat Peta Penempatan Gudang">
                                <i class="fa-solid fa-warehouse"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectSet(setNum, btnEl) {
            activeSetNumber = setNum;
            document.querySelectorAll('.set-pill-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderComponents();
        }

        function filterByDeficit(filterType, btnEl) {
            activeDeficitFilter = filterType;
            document.querySelectorAll('.filter-btn-pill').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderComponents();
        }

        // Custom Warehouse DivIcon Generator
        function getWarehouseIcon(isMulti = false) {
            return L.divIcon({
                className: 'custom-warehouse-pin',
                html: `<div class="warehouse-marker-bubble ${isMulti ? 'multi' : ''}"><i class="fa-solid fa-warehouse"></i></div>`,
                iconSize: [36, 36],
                iconAnchor: [18, 18],
                popupAnchor: [0, -20]
            });
        }

        function openCompLocationsMap(compNo) {
            const comp = componentsData.find(x => x.no === compNo);
            if (!comp) return;

            document.getElementById('mapModalLocTitle').innerText = comp.lokasiList.length > 1 ? 'Multi Titik Gudang Penempatan' : comp.lokasiList[0].nama;
            document.getElementById('mapModalLocSub').innerText = `${comp.katalog} (${comp.tipe})`;
            document.getElementById('mapModalSheet').classList.add('active');

            setTimeout(() => {
                initModalMapWithPoints(comp.lokasiList, comp.katalog);
            }, 250);
        }

        function openAllLocationsMap() {
            document.getElementById('mapModalLocTitle').innerText = 'Semua Titik Gudang Penempatan ERS';
            document.getElementById('mapModalLocSub').innerText = 'Jaringan Gudang & GI Penyimpanan UIW PPB';
            document.getElementById('mapModalSheet').classList.add('active');

            // Collect all unique warehouse locations
            const allPoints = [];
            const visited = new Set();
            componentsData.forEach(comp => {
                comp.lokasiList.forEach(loc => {
                    if (!visited.has(loc.nama)) {
                        visited.add(loc.nama);
                        allPoints.push(loc);
                    }
                });
            });

            setTimeout(() => {
                initModalMapWithPoints(allPoints, 'Semua Material Standby');
            }, 250);
        }

        function initModalMapWithPoints(points, compLabel) {
            const mapEl = document.getElementById('modalMap');
            if (modalMapInstance) {
                modalMapInstance.remove();
                modalMapInstance = null;
            }

            modalMapInstance = L.map(mapEl, {
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18
            }).addTo(modalMapInstance);

            const markers = [];
            points.forEach(pt => {
                const marker = L.marker([pt.lat, pt.lng], { icon: getWarehouseIcon(points.length > 1) })
                    .addTo(modalMapInstance)
                    .bindPopup(`
                        <div style="font-size:12px; font-family:'Inter',sans-serif;">
                            <div style="font-weight:800; color:#0A58CA; display:flex; align-items:center; gap:5px; margin-bottom:3px;">
                                <i class="fa-solid fa-warehouse"></i> ${pt.nama}
                            </div>
                            <div style="color:#0f172a; font-weight:600;">Stok: <b>${pt.qty}</b></div>
                            <div style="color:#64748b; font-size:11px; margin-top:2px;">Status: ${pt.status}</div>
                            <div style="font-size:10.5px; color:#94a3b8; border-top:1px dashed #e2e8f0; margin-top:4px; padding-top:3px;">
                                ${compLabel}
                            </div>
                        </div>
                    `);
                markers.push(marker);
            });

            if (markers.length === 1) {
                modalMapInstance.setView([points[0].lat, points[0].lng], 13);
                markers[0].openPopup();
            } else if (markers.length > 1) {
                const group = new L.featureGroup(markers);
                modalMapInstance.fitBounds(group.getBounds().pad(0.2));
                markers[0].openPopup();
            }
        }

        function closeMapModal(e) {
            if (e.target.id === 'mapModalSheet') closeMapModalDirect();
        }

        function closeMapModalDirect() {
            document.getElementById('mapModalSheet').classList.remove('active');
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'");
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const el = document.getElementById('currentTime');
            if (el) el.innerText = `${h}:${m}`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderComponents();
            updateClock();
            setInterval(updateClock, 30000);
        });
    </script>
