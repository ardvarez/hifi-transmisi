            from {

                transform: scale(0.996);
            }
            to {

                transform: scale(1);
            }

            border: 1px solid transparent;
            transition: all 0.2s;

        .search-input-box:focus-within {

            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);

            height: 4px;

        /* Bottom Sheet Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                        visibility 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay.active .modal-drawer {
            transform: translateY(0);
        }

        .modal-drawer {

            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);

            will-change: transform;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: none;

                </div>

    <script>
        // List detail components with Nomor Pembongkaran (DIS20250000001-0X)
        const detailItemsData = [
            {
                id: 'DIS20250000001-01',
                name: 'Tower Solution - Tension - 150kV',
                statusText: 'Siap Bongkar',
                badgeClass: 'badge-siap',
                targetPembongkaran: '1 Februari 2025',
                slaPembongkaran: '30 Hari',
                targetSelesai: '10 Maret 2025',
                lokasiCount: '4'
            },
            {
                id: 'DIS20250000001-02',
                name: 'SBB - Suspension - 150kV',
                statusText: 'Sedang Dibongkar',
                badgeClass: 'badge-sedang',
                targetPembongkaran: '15 Maret 2025',
                slaPembongkaran: '45 Hari',
                targetSelesai: '1 Mei 2025',
                lokasiCount: '5'
            },
            {
                id: 'DIS20250000001-03',
                name: 'Lindsey - Tension - 275kV',
                statusText: 'Selesai Lokal',
                badgeClass: 'badge-selesai-lokal',
                targetPembongkaran: '20 Maret 2025',
                slaPembongkaran: '14 Hari',
                targetSelesai: '15 Mei 2025',
                lokasiCount: '3'
            },
            {
                id: 'DIS20250000001-04',
                name: 'Tower Solution - Suspension - 500kV',
                statusText: 'Selesai',
                badgeClass: 'badge-selesai',
                targetPembongkaran: '10 Januari 2025',
                slaPembongkaran: '20 Hari',
                targetSelesai: '1 Februari 2025',
                lokasiCount: '4'
            }
        ];

        let selectedDetailStatusChips = [];
        let selectedDetailMerkChips = [];
        let selectedDetailTipeChips = [];
        let selectedDetailTeganganChips = [];
        let detailFilterState = {
            targetPembongkaran: '',
            targetSelesai: '',
            lokasi: ''
        };

        function renderDetailCards(filterQuery = '') {
            const container = document.getElementById('detailCardsContainer');
            const q = filterQuery.toLowerCase().trim();
            
            const filtered = detailItemsData.filter(item => {
                // Search query
                if (q && !(item.name.toLowerCase().includes(q) || item.statusText.toLowerCase().includes(q) || item.id.toLowerCase().includes(q))) {
                    return false;
                }
                // Status chips
                if (selectedDetailStatusChips.length > 0 && !selectedDetailStatusChips.includes(item.statusText)) {
                    return false;
                }
                // Merk chips
                if (selectedDetailMerkChips.length > 0) {
                    const hasMerk = selectedDetailMerkChips.some(merk => item.name.toLowerCase().includes(merk.toLowerCase()));
                    if (!hasMerk) return false;
                }
                // Tipe chips
                if (selectedDetailTipeChips.length > 0) {
                    const hasTipe = selectedDetailTipeChips.some(tipe => item.name.toLowerCase().includes(tipe.toLowerCase()));
                    if (!hasTipe) return false;
                }
                // Tegangan chips
                if (selectedDetailTeganganChips.length > 0) {
                    const hasTegangan = selectedDetailTeganganChips.some(teg => item.name.toLowerCase().includes(teg.toLowerCase()));
                    if (!hasTegangan) return false;
                }
                // Target Pembongkaran filter
                if (detailFilterState.targetPembongkaran && item.targetPembongkaran !== detailFilterState.targetPembongkaran) {
                    return false;
                }
                // Target Selesai filter
                if (detailFilterState.targetSelesai && item.targetSelesai !== detailFilterState.targetSelesai) {
                    return false;
                }
                // Lokasi filter
                if (detailFilterState.lokasi && item.lokasiCount !== detailFilterState.lokasi) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p>Tidak ada data detail yang cocok dengan kriteria filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="detail-item-card" onclick="navigateSmooth('./pembongkaran-action.html?id=' + encodeURIComponent('${item.id}'))" style="cursor: pointer;" title="Klik untuk aksi pembongkaran">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-size: 12px; font-weight: 800; color: #2563eb; letter-spacing: -0.2px;"><i class="fa-solid fa-hashtag" style="font-size: 10px; margin-right: 2px;"></i> ${item.id}</span>
                    </div>
                    <div class="card-header" style="margin-bottom: 12px; padding-bottom: 8px;">
                        <span class="item-title">${item.name}</span>
                        <span class="badge-status ${item.badgeClass}">${item.statusText}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="detail-label">Target Pembongkaran</span>
                            <span class="detail-val">${item.targetPembongkaran}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">SLA Pembongkaran</span>
                            <span class="detail-val">${item.slaPembongkaran}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Target Selesai</span>
                            <span class="detail-val">${item.targetSelesai}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Lokasi</span>
                            <span class="detail-val">${item.lokasiCount}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn-outline-action" style="flex: 1;" onclick="event.stopPropagation(); viewLocation('${item.name}', '${item.lokasiCount}')">View Lokasi</button>
                        <button type="button" class="btn-filter-submit" style="flex: 1; height: 38px; font-size: 12.5px; margin-top: 0;" onclick="event.stopPropagation(); navigateSmooth('./pembongkaran-action.html?id=' + encodeURIComponent('${item.id}'))">Pembongkaran</button>
                    </div>
                </div>
            `).join('');
        }

        function filterDetailCards(val) {
            renderDetailCards(val);
        }

        function toggleDetailStatusChip(btn, status) {
            btn.classList.toggle('active');
            if (selectedDetailStatusChips.includes(status)) {
                selectedDetailStatusChips = selectedDetailStatusChips.filter(s => s !== status);
            } else {
                selectedDetailStatusChips.push(status);
            }
        }

        function toggleDetailMerkChip(btn, merk) {
            btn.classList.toggle('active');
            if (selectedDetailMerkChips.includes(merk)) {
                selectedDetailMerkChips = selectedDetailMerkChips.filter(m => m !== merk);
            } else {
                selectedDetailMerkChips.push(merk);
            }
        }

        function toggleDetailTipeChip(btn, tipe) {
            btn.classList.toggle('active');
            if (selectedDetailTipeChips.includes(tipe)) {
                selectedDetailTipeChips = selectedDetailTipeChips.filter(t => t !== tipe);
            } else {
                selectedDetailTipeChips.push(tipe);
            }
        }

        function toggleDetailTeganganChip(btn, tegangan) {
            btn.classList.toggle('active');
            if (selectedDetailTeganganChips.includes(tegangan)) {
                selectedDetailTeganganChips = selectedDetailTeganganChips.filter(t => t !== tegangan);
            } else {
                selectedDetailTeganganChips.push(tegangan);
            }
        }

        function viewLocation(towerName, count) {
            const num = parseInt(count) || 3;
            let itemsHtml = '';
            for (let i = 1; i <= num; i++) {
                itemsHtml += `
                    <div class="location-item-card">
                        <div class="location-icon-wrapper">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div style="flex: 1;">
                            <div class="location-item-title">Tower Span #${80 + i * 2}</div>
                            <div class="location-item-sub">Koordinat: -7.25${i}5, 110.18${i}6 • SUTT 150kV</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('drawerModalContent').innerHTML = `
                <div class="filter-bottom-sheet">
                    <div class="location-sheet-header">
                        <h2 class="location-sheet-title">${towerName}</h2>
                        <span class="location-count-badge">${count} Lokasi</span>
                    </div>
                    <div class="location-subtitle">Daftar span tower darurat ERS terpasang pada jalur transmisi.</div>

                    <div class="location-items-list">
                        ${itemsHtml}
                    </div>

                    <button type="button" class="btn-filter-submit" onclick="closeFilterModalDirect()">Tutup</button>
                </div>
            `;
            openModal();
        }

        function renderFilterSheetContent() {
            const allStatuses = ['Mulai', 'Sedang Dibongkar', 'Selesai Lokal', 'Selesai'];
            const allMerks = ['Tower Solution', 'SBB', 'Lindsey'];
            const allTipes = ['Tension', 'Suspension'];
            const allTegangan = ['150kV', '275kV', '500kV'];

            const statusChipsHtml = allStatuses.map(status => {
                const isActive = selectedDetailStatusChips.includes(status);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailStatusChip(this, '${status}')">${status}</button>`;
            }).join('');

            const merkChipsHtml = allMerks.map(merk => {
                const isActive = selectedDetailMerkChips.includes(merk);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailMerkChip(this, '${merk}')">${merk}</button>`;
            }).join('');

            const tipeChipsHtml = allTipes.map(tipe => {
                const isActive = selectedDetailTipeChips.includes(tipe);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailTipeChip(this, '${tipe}')">${tipe}</button>`;
            }).join('');

            const teganganChipsHtml = allTegangan.map(tegangan => {
                const isActive = selectedDetailTeganganChips.includes(tegangan);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailTeganganChip(this, '${tegangan}')">${tegangan}</button>`;
            }).join('');

            document.getElementById('drawerModalContent').innerHTML = `
                <div class="filter-bottom-sheet">
                    <h2 class="filter-drawer-title">Filter Detail Pembongkaran</h2>
                    
                    <div class="filter-section">
                        <label class="filter-section-label">Status Component</label>
                        <div class="chips-container">
                            ${statusChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Merk ERS</label>
                        <div class="chips-container">
                            ${merkChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tipe Tower</label>
                        <div class="chips-container">
                            ${tipeChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tegangan System</label>
                        <div class="chips-container">
                            ${teganganChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Target Pembongkaran</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterDetailTargetPem" class="filter-input-field" placeholder="1 Februari 2025" value="${detailFilterState.targetPembongkaran || ''}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Target Selesai</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterDetailTargetOp" class="filter-input-field" placeholder="10 Maret 2025" value="${detailFilterState.targetSelesai || ''}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Jumlah Lokasi</label>
                        <div class="input-with-icon">
                            <select id="filterDetailLokasi" class="filter-input-field filter-select-field">
                                <option value="" ${!detailFilterState.lokasi ? 'selected' : ''}>Pilih Lokasi</option>
                                <option value="3" ${detailFilterState.lokasi === '3' ? 'selected' : ''}>3</option>
                                <option value="4" ${detailFilterState.lokasi === '4' ? 'selected' : ''}>4</option>
                                <option value="5" ${detailFilterState.lokasi === '5' ? 'selected' : ''}>5</option>
                            </select>
                            <i class="fa-solid fa-chevron-down input-right-icon"></i>
                        </div>
                    </div>

                    <div class="sheet-actions-stack">
                        <button type="button" class="btn-sheet-secondary" onclick="resetDetailFilter()">Reset</button>
                        <button type="button" class="btn-filter-submit" style="margin-top:0;" onclick="applyDetailFilter()">Terapkan Filter</button>
                    </div>
                </div>
            `;
        }

        function openModal() {
            document.getElementById('filterModal').classList.add('active');
        }

        function openFilterModalDrawer() {
            renderFilterSheetContent();
            openModal();
        }

        function applyDetailFilter() {
            const targetPemVal = document.getElementById('filterDetailTargetPem') ? document.getElementById('filterDetailTargetPem').value.trim() : '';
            const targetOpVal = document.getElementById('filterDetailTargetOp') ? document.getElementById('filterDetailTargetOp').value.trim() : '';
            const lokasiVal = document.getElementById('filterDetailLokasi') ? document.getElementById('filterDetailLokasi').value : '';

            detailFilterState = {
                targetPembongkaran: targetPemVal,
                targetSelesai: targetOpVal,
                lokasi: lokasiVal
            };

            closeFilterModalDirect();
            renderDetailCards(document.getElementById('detailSearchInput').value);
        }

        function resetDetailFilter() {
            selectedDetailStatusChips = [];
            selectedDetailMerkChips = [];
            selectedDetailTipeChips = [];
            selectedDetailTeganganChips = [];
            detailFilterState = { targetPembongkaran: '', targetSelesai: '', lokasi: '' };
            renderFilterSheetContent();
            renderDetailCards('');
        }

        function closeFilterModalDirect() {
            const modal = document.getElementById('filterModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        function navigateSmooth(url, e) {
            const container = document.querySelector('.mobile-container');
            if (container) {
                container.style.opacity = '0.6';
                container.style.transition = 'opacity 0.08s ease';
            }
            window.location.href = url;
        }

        function closeFilterModal(e) {
            if (!e || e.target.id === 'filterModal' || e.target.classList.contains('modal-overlay')) {
                closeFilterModalDirect();
            }
        }

        // Init URL param for dynamic card ID
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || 'DIS20250000001';
        const titleEl = document.getElementById('pageMainTitle');
        if (titleEl) {
            titleEl.textContent = `ERS (${cardId})`;
        }
        document.title = `List Pembongkaran ERS - ${cardId}`;

        // Initial render
        renderDetailCards();
    </script>
