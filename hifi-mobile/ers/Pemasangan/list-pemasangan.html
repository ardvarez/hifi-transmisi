<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>List Pemasangan ERS - INS20250000001</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f4f6fc;
            --card-bg: #ffffff;
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Top Header */
        .header-section {
            background: #ffffff;
            padding: 14px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .title-with-back {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }

        .back-home-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-home-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .main-title {
            font-size: 15.5px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .sub-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-left: 42px;
        }

        .notif-bell-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 16px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }

        .notif-badge-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Search and Filter Section */
        .search-filter-section {
            background: #ffffff;
            padding: 10px 20px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-box {
            flex: 1;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .search-input-box:focus-within {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .search-input-box input::placeholder {
            color: #94a3b8;
        }

        .search-input-box i {
            color: #94a3b8;
            font-size: 14px;
        }

        .filter-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .filter-btn:active {
            background: #f8fafc;
        }

        /* App Body / Content Area */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-canvas);
            padding-bottom: 24px;
            scrollbar-width: none;
        }

        .app-body::-webkit-scrollbar {
            display: none;
        }

        /* Top Schedule Info Card */
        .schedule-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
        }

        .schedule-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .schedule-val {
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: -0.1px;
        }

        /* Detail Item Card Styling */
        .detail-item-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .item-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
            flex: 1;
            max-width: 65%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.35;
        }

        /* 4 Distinct Status Badge Color Variants */
        .badge-status {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* 1. Sedang Dikirim -> Orange / Amber Theme */
        .badge-dikirim {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #ffedd5;
        }

        /* 2. Siap Pasang -> Soft Blue Theme */
        .badge-siap {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
        }

        /* 3. Sedang Dipasang -> Sky Blue / Cyan Theme */
        .badge-pasang {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
        }

        /* 4. Sudah Terpasang -> Emerald Green Theme */
        .badge-terpasang {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* Card Field Rows */
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Action Button */
        .btn-outline-action {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #ffffff;
            border: 1.5px solid #2563eb;
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.06);
        }

        .btn-outline-action:active {
            background: #eff6ff;
        }

        /* Smooth Drawer Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                        visibility 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay.active .modal-drawer {
            transform: translateY(0);
        }

        .modal-drawer {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 16px;
            cursor: pointer;
        }

        /* Location Bottom Sheet Styling */
        .location-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .location-sheet-title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
        }

        .location-count-badge {
            background: #eff6ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
        }

        .location-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .location-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .location-item-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .location-icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .location-item-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .location-item-sub {
            font-size: 11px;
            color: #64748b;
        }

        .btn-filter-submit {
            width: 100%;
            height: 44px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        }

        /* Filter Bottom Sheet Drawer Styling */
        .filter-bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .filter-drawer-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-section-label {
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip-item {
            padding: 6px 14px;
            border-radius: 18px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip-item.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
        }

        .filter-input-field {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 12.5px;
            color: #0f172a;
            font-weight: 600;
            outline: none;
        }

        .filter-input-field:focus {
            border-color: #2563eb;
            background: #ffffff;
        }

        .input-with-icon {
            position: relative;
            width: 100%;
        }

        .input-right-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
        }

        .filter-select-field {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .sheet-actions-stack {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-sheet-secondary {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            color: #475569;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* iOS Bottom Bar Indicator */
        .ios-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 101;
        }
    </style>
</head>

<body>

    <div class="mobile-container">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <span>9:41 AM</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Header with Back to Pemasangan Home -->
        <div class="header-section">
            <div class="header-titles">
                <div class="title-with-back">
                    <a href="./home-mobile.html" class="back-home-btn" onclick="navigateSmooth('./home-mobile.html', event)" title="Kembali ke Pemasangan">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                    <h1 class="main-title" id="pageMainTitle">ERS (ASM20250000001)</h1>
                </div>
                <span class="sub-title">Pemasangan</span>
            </div>
            <a href="../../power-inspect/notifikasi-mobile.html" class="notif-bell-btn" title="Notifikasi">
                <i class="fa-regular fa-bell"></i>
                <span class="notif-badge-dot"></span>
            </a>
        </div>

        <!-- Search & Filter Bar -->
        <div class="search-filter-section">
            <div class="search-input-box">
                <input type="text" id="detailSearchInput" placeholder="Cari" oninput="filterDetailCards(this.value)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="filter-btn" onclick="openFilterModal()" title="Filter Data">
                <i class="fa-solid fa-filter"></i>
            </button>
        </div>

        <!-- App Body / Content Area -->
        <div class="app-body">
            
            <!-- Schedule Summary Card (Waktu Berangkat & Waktu Tiba) -->
            <div class="schedule-card">
                <div class="schedule-row">
                    <span class="schedule-label">Waktu Berangkat</span>
                    <span class="schedule-val">1 Februari 2025, (10:00 WIB)</span>
                </div>
                <div class="schedule-row">
                    <span class="schedule-label">Waktu Tiba</span>
                    <span class="schedule-val">2 Maret 2025, (09:45 WIB)</span>
                </div>
            </div>

            <!-- List of Tower Detail Components -->
            <div id="detailCardsContainer">
                <!-- Injected via JavaScript -->
            </div>

        </div>

        <!-- iOS Bottom Bar Line -->
        <div class="ios-bar"></div>

        <!-- Bottom Sheet Overlay Container -->
        <div class="modal-overlay" id="filterModal" onclick="closeFilterModal(event)">
            <div class="modal-drawer" onclick="event.stopPropagation()">
                <div class="drawer-handle" onclick="closeFilterModalDirect()" title="Klik/Tarik untuk tutup"></div>
                <div id="drawerModalContent">
                    <!-- Dynamic Sheet Content (Filter / View Lokasi) -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // List detail components with Nomor Pemasangan (ASM20250000001-0X)
        const detailItemsData = [
            {
                id: 'ASM20250000001-01',
                name: 'Tower Solution - Tension - 150kV',
                statusText: 'Siap Pasang',
                badgeClass: 'badge-siap',
                targetPemasangan: '1 Februari 2025',
                slaPemasangan: '30 Hari',
                targetOperasi: '10 Maret 2025',
                lokasiCount: '4'
            },
            {
                id: 'ASM20250000001-02',
                name: 'SBB - Suspension - 150kV',
                statusText: 'Sedang Dipasang',
                badgeClass: 'badge-pasang',
                targetPemasangan: '15 Maret 2025',
                slaPemasangan: '45 Hari',
                targetOperasi: '1 Mei 2025',
                lokasiCount: '5'
            },
            {
                id: 'ASM20250000001-03',
                name: 'Lindsey - Tension - 275kV',
                statusText: 'Sedang Dikirim',
                badgeClass: 'badge-dikirim',
                targetPemasangan: '20 Maret 2025',
                slaPemasangan: '14 Hari',
                targetOperasi: '15 Mei 2025',
                lokasiCount: '3'
            },
            {
                id: 'ASM20250000001-04',
                name: 'Tower Solution - Suspension - 500kV',
                statusText: 'Sudah Terpasang',
                badgeClass: 'badge-terpasang',
                targetPemasangan: '10 Januari 2025',
                slaPemasangan: '20 Hari',
                targetOperasi: '1 Februari 2025',
                lokasiCount: '4'
            }
        ];

        let selectedDetailStatusChips = [];
        let selectedDetailMerkChips = [];
        let selectedDetailTipeChips = [];
        let selectedDetailTeganganChips = [];
        let detailFilterState = {
            targetPemasangan: '',
            targetOperasi: '',
            lokasi: ''
        };

        function renderDetailCards(filterQuery = '') {
            const container = document.getElementById('detailCardsContainer');
            const q = filterQuery.toLowerCase().trim();
            
            const filtered = detailItemsData.filter(item => {
                // Search query
                if (q && !(item.name.toLowerCase().includes(q) || item.statusText.toLowerCase().includes(q) || item.id.toLowerCase().includes(q))) {
                    return false;
                }
                // Status chips
                if (selectedDetailStatusChips.length > 0 && !selectedDetailStatusChips.includes(item.statusText)) {
                    return false;
                }
                // Merk chips
                if (selectedDetailMerkChips.length > 0) {
                    const hasMerk = selectedDetailMerkChips.some(merk => item.name.toLowerCase().includes(merk.toLowerCase()));
                    if (!hasMerk) return false;
                }
                // Tipe chips
                if (selectedDetailTipeChips.length > 0) {
                    const hasTipe = selectedDetailTipeChips.some(tipe => item.name.toLowerCase().includes(tipe.toLowerCase()));
                    if (!hasTipe) return false;
                }
                // Tegangan chips
                if (selectedDetailTeganganChips.length > 0) {
                    const hasTegangan = selectedDetailTeganganChips.some(teg => item.name.toLowerCase().includes(teg.toLowerCase()));
                    if (!hasTegangan) return false;
                }
                // Lokasi filter
                if (detailFilterState.lokasi && item.lokasiCount !== detailFilterState.lokasi) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p>Tidak ada data detail yang cocok dengan kriteria filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="detail-item-card" onclick="navigateSmooth('./pemasangan-action.html?id=' + encodeURIComponent('${item.id}'))" style="cursor: pointer;" title="Klik untuk aksi pemasangan">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-size: 12px; font-weight: 800; color: #2563eb; letter-spacing: -0.2px;"><i class="fa-solid fa-hashtag" style="font-size: 10px; margin-right: 2px;"></i> ${item.id}</span>
                    </div>
                    <div class="card-header" style="margin-bottom: 12px; padding-bottom: 8px;">
                        <span class="item-title">${item.name}</span>
                        <span class="badge-status ${item.badgeClass}">${item.statusText}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="detail-label">Target Pemasangan</span>
                            <span class="detail-val">${item.targetPemasangan}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">SLA Pemasangan</span>
                            <span class="detail-val">${item.slaPemasangan}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Target Operasi</span>
                            <span class="detail-val">${item.targetOperasi}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Lokasi</span>
                            <span class="detail-val">${item.lokasiCount}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn-outline-action" style="flex: 1;" onclick="event.stopPropagation(); viewLocation('${item.name}', '${item.lokasiCount}')">View Lokasi</button>
                        <button type="button" class="btn-filter-submit" style="flex: 1; height: 38px; font-size: 12.5px; margin-top: 0;" onclick="event.stopPropagation(); navigateSmooth('./pemasangan-action.html?id=' + encodeURIComponent('${item.id}'))">Pemasangan</button>
                    </div>
                </div>
            `).join('');
        }

        function filterDetailCards(val) {
            renderDetailCards(val);
        }

        function toggleDetailStatusChip(btn, status) {
            btn.classList.toggle('active');
            if (selectedDetailStatusChips.includes(status)) {
                selectedDetailStatusChips = selectedDetailStatusChips.filter(s => s !== status);
            } else {
                selectedDetailStatusChips.push(status);
            }
        }

        function toggleDetailMerkChip(btn, merk) {
            btn.classList.toggle('active');
            if (selectedDetailMerkChips.includes(merk)) {
                selectedDetailMerkChips = selectedDetailMerkChips.filter(m => m !== merk);
            } else {
                selectedDetailMerkChips.push(merk);
            }
        }

        function toggleDetailTipeChip(btn, tipe) {
            btn.classList.toggle('active');
            if (selectedDetailTipeChips.includes(tipe)) {
                selectedDetailTipeChips = selectedDetailTipeChips.filter(t => t !== tipe);
            } else {
                selectedDetailTipeChips.push(tipe);
            }
        }

        function toggleDetailTeganganChip(btn, tegangan) {
            btn.classList.toggle('active');
            if (selectedDetailTeganganChips.includes(tegangan)) {
                selectedDetailTeganganChips = selectedDetailTeganganChips.filter(t => t !== tegangan);
            } else {
                selectedDetailTeganganChips.push(tegangan);
            }
        }

        function renderFilterSheetContent() {
            const allStatuses = ['Sedang Dikirim', 'Siap Pasang', 'Sedang Dipasang', 'Sudah Terpasang'];
            const allMerks = ['Tower Solution', 'SBB', 'Lindsey'];
            const allTipes = ['Tension', 'Suspension'];
            const allTegangan = ['150kV', '275kV', '500kV'];

            const statusChipsHtml = allStatuses.map(status => {
                const isActive = selectedDetailStatusChips.includes(status);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailStatusChip(this, '${status}')">${status}</button>`;
            }).join('');

            const merkChipsHtml = allMerks.map(merk => {
                const isActive = selectedDetailMerkChips.includes(merk);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailMerkChip(this, '${merk}')">${merk}</button>`;
            }).join('');

            const tipeChipsHtml = allTipes.map(tipe => {
                const isActive = selectedDetailTipeChips.includes(tipe);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailTipeChip(this, '${tipe}')">${tipe}</button>`;
            }).join('');

            const teganganChipsHtml = allTegangan.map(tegangan => {
                const isActive = selectedDetailTeganganChips.includes(tegangan);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleDetailTeganganChip(this, '${tegangan}')">${tegangan}</button>`;
            }).join('');

            document.getElementById('drawerModalContent').innerHTML = `
                <div class="filter-bottom-sheet">
                    <h2 class="filter-drawer-title">Filter Detail Pemasangan</h2>
                    
                    <div class="filter-section">
                        <label class="filter-section-label">Status Component</label>
                        <div class="chips-container">
                            ${statusChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Merk ERS</label>
                        <div class="chips-container">
                            ${merkChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tipe Tower</label>
                        <div class="chips-container">
                            ${tipeChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tegangan System</label>
                        <div class="chips-container">
                            ${teganganChipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Target Pemasangan</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterDetailTargetPem" class="filter-input-field" placeholder="1 Februari 2025" value="${detailFilterState.targetPemasangan || ''}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Target Operasi</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterDetailTargetOp" class="filter-input-field" placeholder="10 Maret 2025" value="${detailFilterState.targetOperasi || ''}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Jumlah Lokasi</label>
                        <div class="input-with-icon">
                            <select id="filterDetailLokasi" class="filter-input-field filter-select-field">
                                <option value="" ${!detailFilterState.lokasi ? 'selected' : ''}>Pilih Lokasi</option>
                                <option value="3" ${detailFilterState.lokasi === '3' ? 'selected' : ''}>3</option>
                                <option value="4" ${detailFilterState.lokasi === '4' ? 'selected' : ''}>4</option>
                                <option value="5" ${detailFilterState.lokasi === '5' ? 'selected' : ''}>5</option>
                            </select>
                            <i class="fa-solid fa-chevron-down input-right-icon"></i>
                        </div>
                    </div>

                    <div class="sheet-actions-stack">
                        <button type="button" class="btn-sheet-secondary" onclick="resetDetailFilter()">Reset</button>
                        <button type="button" class="btn-filter-submit" style="margin-top:0;" onclick="applyDetailFilter()">Terapkan Filter</button>
                    </div>
                </div>
            `;
        }

        function applyDetailFilter() {
            const targetPemVal = document.getElementById('filterDetailTargetPem') ? document.getElementById('filterDetailTargetPem').value.trim() : '';
            const targetOpVal = document.getElementById('filterDetailTargetOp') ? document.getElementById('filterDetailTargetOp').value.trim() : '';
            const lokasiVal = document.getElementById('filterDetailLokasi') ? document.getElementById('filterDetailLokasi').value : '';

            detailFilterState = {
                targetPemasangan: targetPemVal,
                targetOperasi: targetOpVal,
                lokasi: lokasiVal
            };

            closeFilterModalDirect();
            renderDetailCards(document.getElementById('detailSearchInput').value);
        }

        function resetDetailFilter() {
            selectedDetailStatusChips = [];
            selectedDetailMerkChips = [];
            selectedDetailTipeChips = [];
            selectedDetailTeganganChips = [];
            detailFilterState = { targetPemasangan: '', targetOperasi: '', lokasi: '' };
            renderFilterSheetContent();
            renderDetailCards('');
        }

        function closeFilterModalDirect() {
            const modal = document.getElementById('filterModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        function navigateSmooth(url, e) {
            const container = document.querySelector('.mobile-container');
            if (container) {
                container.style.opacity = '0.6';
                container.style.transition = 'opacity 0.08s ease';
            }
            window.location.href = url;
        }

        function closeFilterModal(e) {
            if (!e || e.target.id === 'filterModal' || e.target.classList.contains('modal-overlay')) {
                closeFilterModalDirect();
            }
        }

        // Init URL param for dynamic card ID
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || 'ASM20250000001';
        const titleEl = document.getElementById('pageMainTitle');
        if (titleEl) {
            titleEl.textContent = `ERS (${cardId})`;
        }
        document.title = `List Pemasangan ERS - ${cardId}`;

        // Initial render
        renderDetailCards();
    </script>
