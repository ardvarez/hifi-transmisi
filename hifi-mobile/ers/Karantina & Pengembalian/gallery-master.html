<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeri Master Komponen - ERS Mobile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #0284c7;
            --primary-blue-dark: #0369a1;
            --pln-blue: #0A58CA;
            --bg-canvas: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 50px 0 20px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Top Header */
        .header-section {
            background: #ffffff;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-main-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        .header-sub-code {
            font-size: 11.5px;
            font-weight: 600;
            color: #64748b;
        }

        /* App Body / Scrollable Gallery Area */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }

        .app-body::-webkit-scrollbar {
            display: none;
        }

        /* Full Photo Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .photo-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .photo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            border-color: #93c5fd;
        }

        .photo-card:active {
            transform: scale(0.98);
        }

        .photo-thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #e2e8f0;
            overflow: hidden;
        }

        .photo-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .photo-card:hover .photo-thumb-img {
            transform: scale(1.06);
        }

        .photo-expand-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            backdrop-filter: blur(4px);
        }

        .photo-info-box {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: #ffffff;
        }

        .photo-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-size-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Lightbox Fullscreen Viewer */
        .lightbox-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            color: #ffffff;
            z-index: 10;
        }

        .lightbox-counter {
            font-size: 12.5px;
            font-weight: 700;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .lightbox-btn-close {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lightbox-btn-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-image-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 16px;
            overflow: hidden;
        }

        .lightbox-main-img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            z-index: 10;
        }

        .lightbox-nav-btn:hover {
            background: var(--primary-blue);
        }

        .lightbox-prev {
            left: 12px;
        }

        .lightbox-next {
            right: 12px;
        }

        .lightbox-details-panel {
            background: #1e293b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px 24px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lightbox-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .lightbox-size-row {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* iOS Bottom Indicator Line */
        .ios-bar {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 101;
        }

        /* Dark Mode System */
        html.dark-mode,
        body.dark-mode {
            background-color: #cbd5e1 !important;
        }

        html.dark-mode .mobile-container,
        body.dark-mode .mobile-container {
            --bg-color: #0b1329 !important;
            --bg-canvas: #0b1329 !important;
            background-color: #0b1329 !important;
        }

        body.dark-mode .status-bar,
        html.dark-mode .status-bar {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }

        body.dark-mode .header-section,
        html.dark-mode .header-section {
            background-color: #1e293b !important;
            border-bottom-color: #334155 !important;
        }

        body.dark-mode .header-main-title,
        html.dark-mode .header-main-title {
            color: #f8fafc !important;
        }

        body.dark-mode .back-btn,
        html.dark-mode .back-btn {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        body.dark-mode .photo-card,
        html.dark-mode .photo-card {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-mode .photo-info-box,
        html.dark-mode .photo-info-box {
            background: #1e293b !important;
        }

        body.dark-mode .photo-title,
        html.dark-mode .photo-title {
            color: #f8fafc !important;
        }

        body.dark-mode .photo-size-text,
        html.dark-mode .photo-size-text {
            color: #94a3b8 !important;
        }

        body.dark-mode .ios-bar,
        html.dark-mode .ios-bar {
            background: #ffffff !important;
        }
    </style>

    <script>
        (function() {
            function checkTheme() {
                try {
                    const isDark = localStorage.getItem('pln_mobile_theme') === 'dark' || 
                                   localStorage.getItem('hifi-portal-theme') === 'dark' ||
                                   (window.parent && window.parent.document && window.parent.document.documentElement && window.parent.document.documentElement.getAttribute('data-theme') === 'dark');
                    if (isDark) {
                        document.documentElement.classList.add('dark-mode');
                        if (document.body) document.body.classList.add('dark-mode');
                    } else {
                        document.documentElement.classList.remove('dark-mode');
                        if (document.body) document.body.classList.remove('dark-mode');
                    }
                } catch(e) {
                    if (localStorage.getItem('pln_mobile_theme') === 'dark') {
                        document.documentElement.classList.add('dark-mode');
                        if (document.body) document.body.classList.add('dark-mode');
                    }
                }
            }
            checkTheme();
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', checkTheme);
            }
        })();
    </script>
</head>

<body>

    <div class="mobile-container">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <span>9:41 AM</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Header -->
        <div class="header-section">
            <div class="header-left">
                <button type="button" class="back-btn" onclick="goBack()" title="Kembali ke Check Sheet">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="header-title-box">
                    <h1 class="header-main-title">Galeri Master Komponen</h1>
                    <span class="header-sub-code" id="pageHeaderSubtitle">Plate Column • 3 Foto</span>
                </div>
            </div>
        </div>

        <!-- App Body / Full Photo Gallery Grid Area -->
        <div class="app-body">
            <div class="gallery-grid" id="masterGalleryGrid">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Lightbox Fullscreen Viewer -->
        <div class="lightbox-modal" id="lightboxModal">
            <div class="lightbox-topbar">
                <div class="lightbox-counter" id="lightboxCounter">Foto 1 dari 3</div>
                <button type="button" class="lightbox-btn-close" onclick="closeLightbox()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="lightbox-image-wrapper">
                <button type="button" class="lightbox-nav-btn lightbox-prev" onclick="navigateLightbox(-1)">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <img src="" alt="Master Komponen" class="lightbox-main-img" id="lightboxImg">
                <button type="button" class="lightbox-nav-btn lightbox-next" onclick="navigateLightbox(1)">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div class="lightbox-details-panel">
                <h3 class="lightbox-title" id="lightboxTitle">Tampak Utama / Geometri Pelat</h3>
                <div class="lightbox-size-row">
                    <i class="fa-regular fa-image"></i>
                    <span id="lightboxSize">3.4 MB</span>
                </div>
            </div>
        </div>

        <!-- iOS Bottom Indicator Line -->
        <div class="ios-bar"></div>
    </div>

    <script>
        // Read URL params
        const urlParams = new URLSearchParams(window.location.search);
        const compParam = urlParams.get('comp') || 'plate_column';
        const sectionParam = urlParams.get('section') || 'Column Section';
        const orderIdParam = urlParams.get('id') || 'RTR20250000001';
        const isKarantinaUlang = urlParams.get('mode') === 'karantina_ulang';

        // Master Components Dataset
        const MASTER_DATABASE = {
            'plate_column': {
                name: 'Plate Column ERS',
                photos: [
                    {
                        title: 'Tampak Utama / Geometri Pelat',
                        img: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1200&q=80',
                        size: '3.4 MB'
                    },
                    {
                        title: 'Detail Lubang Baut M16',
                        img: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1200&q=80',
                        size: '2.8 MB'
                    },
                    {
                        title: 'Standar Marking & Serial Tag',
                        img: 'https://images.unsplash.com/photo-1581092335397-9583fe92d232?auto=format&fit=crop&w=1200&q=80',
                        size: '3.1 MB'
                    }
                ]
            },
            'erection_tools': {
                name: 'Erection Tools Kit',
                photos: [
                    {
                        title: 'Set Winch & Gin Pole Tool',
                        img: 'https://images.unsplash.com/photo-1581092162384-8987c1d64718?auto=format&fit=crop&w=1200&q=80',
                        size: '3.6 MB'
                    },
                    {
                        title: 'Tensioner & Wire Grip Clamp',
                        img: 'https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1200&q=80',
                        size: '2.9 MB'
                    },
                    {
                        title: 'Toolbox Storage & Label Kit',
                        img: 'https://images.unsplash.com/photo-1544724796-5f56436f5f1c?auto=format&fit=crop&w=1200&q=80',
                        size: '3.2 MB'
                    }
                ]
            },
            'base_pivot': {
                name: 'Base Pivot Foundation',
                photos: [
                    {
                        title: 'Tapak Base Pivot Keseluruhan',
                        img: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1200&q=80',
                        size: '3.8 MB'
                    },
                    {
                        title: 'Pin Poros & Bushing Swivel',
                        img: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1200&q=80',
                        size: '3.0 MB'
                    },
                    {
                        title: 'Stamping Kapasitas Beban',
                        img: 'https://images.unsplash.com/photo-1581092335397-9583fe92d232?auto=format&fit=crop&w=1200&q=80',
                        size: '3.3 MB'
                    }
                ]
            },
            'anchor_bolt': {
                name: 'Anchor Bolt & Ground Plate',
                photos: [
                    {
                        title: 'Set Angkur Pondasi & Mur Ganda',
                        img: 'https://images.unsplash.com/photo-1581092162384-8987c1d64718?auto=format&fit=crop&w=1200&q=80',
                        size: '3.1 MB'
                    },
                    {
                        title: 'Detail Ulir & Lapisan Dacromet',
                        img: 'https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1200&q=80',
                        size: '2.7 MB'
                    },
                    {
                        title: 'Pelat Pengikat Cross Base',
                        img: 'https://images.unsplash.com/photo-1544724796-5f56436f5f1c?auto=format&fit=crop&w=1200&q=80',
                        size: '3.5 MB'
                    }
                ]
            }
        };

        let currentActiveCompKey = compParam in MASTER_DATABASE ? compParam : 'plate_column';
        let currentPhotosList = [];
        let currentLightboxIndex = 0;

        function initPage() {
            const data = MASTER_DATABASE[currentActiveCompKey] || MASTER_DATABASE['plate_column'];
            currentPhotosList = data.photos;

            // Set Title & Subtitle
            document.getElementById('pageHeaderSubtitle').textContent = `${data.name} • ${currentPhotosList.length} Foto`;

            renderGalleryGrid();
        }

        function renderGalleryGrid() {
            const gridEl = document.getElementById('masterGalleryGrid');
            if (!gridEl) return;

            gridEl.innerHTML = currentPhotosList.map((p, idx) => `
                <div class="photo-card" onclick="openLightbox(${idx})">
                    <div class="photo-thumb-container">
                        <img src="${p.img}" alt="${p.title}" class="photo-thumb-img">
                        <div class="photo-expand-hint">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>
                    <div class="photo-info-box">
                        <h4 class="photo-title" title="${p.title}">${p.title}</h4>
                        <div class="photo-size-text">
                            <i class="fa-regular fa-image" style="font-size: 10px;"></i>
                            <span>${p.size}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Lightbox Functions
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightboxView();
            document.getElementById('lightboxModal').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        function navigateLightbox(dir) {
            if (!currentPhotosList.length) return;
            const total = currentPhotosList.length;
            currentLightboxIndex = (currentLightboxIndex + dir + total) % total;
            updateLightboxView();
        }

        function updateLightboxView() {
            const p = currentPhotosList[currentLightboxIndex];
            if (!p) return;

            document.getElementById('lightboxCounter').textContent = `Foto ${currentLightboxIndex + 1} dari ${currentPhotosList.length}`;
            document.getElementById('lightboxImg').src = p.img;
            document.getElementById('lightboxTitle').textContent = p.title;
            document.getElementById('lightboxSize').textContent = p.size;
        }

        function goBack() {
            const modeQuery = isKarantinaUlang ? '&mode=karantina_ulang' : '';
            window.location.href = `./check-sheet.html?section=${encodeURIComponent(sectionParam)}&id=${encodeURIComponent(orderIdParam)}${modeQuery}`;
        }

        // Keyboard & Swipe support
        window.addEventListener('keydown', e => {
            const modal = document.getElementById('lightboxModal');
            if (modal && modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Initialize on DOM Ready
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>

</html>
