<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>List Karantina & Pengembalian ERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f4f6fc;
            --card-bg: #ffffff;
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Top Header */
        .header-section {
            background: #ffffff;
            padding: 14px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .title-with-back {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }

        .back-home-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-home-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .main-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .sub-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-left: 42px;
        }

        .notif-bell-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 16px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }

        .notif-badge-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Search and Filter Section */
        .search-filter-section {
            background: #ffffff;
            padding: 10px 20px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-box {
            flex: 1;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .search-input-box:focus-within {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .search-input-box input::placeholder {
            color: #94a3b8;
        }

        .search-input-box i {
            color: #94a3b8;
            font-size: 15px;
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .filter-btn:active {
            background: #f8fafc;
        }

        /* App Body / Content Area */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-canvas);
            padding-bottom: 24px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .app-body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Detail Item Card */
        .detail-item-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .detail-item-card:hover {
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.07);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 15.5px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        /* Status Badge Variants */
        .badge-status {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-dikirim,
        .badge-siap,
        .badge-sedang,
        .badge-selesai-lokal {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #ffedd5;
        }

        .badge-selesai {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        /* Card Details Rows */
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: var(--text-dark);
            font-weight: 700;
            text-align: right;
        }

        .btn-filter-submit {
            width: 100%;
            height: 44px;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-filter-submit:active {
            background: var(--primary-blue-dark);
            transform: scale(0.99);
        }

        /* iOS Bottom Bar Indicator */
        .ios-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 101;
            pointer-events: none;
        }

        /* Drawer Filter Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                        visibility 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-overlay.active .modal-drawer {
            transform: translateY(0);
        }

        .modal-drawer {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .modal-drawer::-webkit-scrollbar {
            display: none;
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 16px;
            cursor: pointer;
        }

        /* Filter Bottom Sheet Styling */
        .filter-bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .filter-drawer-title {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-section-label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            outline: none;
        }

        .chip-item.active {
            border: 1.5px solid #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        .input-with-icon {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .filter-input-field {
            width: 100%;
            height: 48px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-input-field::placeholder {
            color: #94a3b8;
        }

        .input-with-icon .filter-input-field {
            padding-right: 44px;
        }

        .filter-select-field {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .input-right-icon {
            position: absolute;
            right: 16px;
            color: #2563eb;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="mobile-container">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <span>9:41 AM</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Header -->
        <div class="header-section">
            <div class="header-titles">
                <div class="title-with-back">
                    <a href="./home-mobile.html" class="back-home-btn" onclick="navigateSmooth('./home-mobile.html', event)" title="Kembali ke Karantina Home">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                    <h1 class="main-title">ERS</h1>
                </div>
                <span class="sub-title" id="pageOrderSubtitle">RTR20250000001</span>
            </div>
            <a href="../../power-inspect/notifikasi-mobile.html" class="notif-bell-btn" title="Notifikasi">
                <i class="fa-regular fa-bell"></i>
                <span class="notif-badge-dot"></span>
            </a>
        </div>

        <!-- Search & Filter Bar -->
        <div class="search-filter-section">
            <div class="search-input-box">
                <input type="text" id="karantinaListSearchInput" placeholder="Cari" oninput="filterDetailList(this.value)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="filter-btn" onclick="openFilterModalDrawer()" title="Filter Data">
                <i class="fa-solid fa-filter"></i>
            </button>
        </div>

        <!-- App Body / Content Area -->
        <div class="app-body" id="detailCardsContainer">
            <!-- Injected via JavaScript -->
        </div>

        <!-- iOS Bottom Indicator Line -->
        <div class="ios-bar"></div>

        <!-- Drawer Filter Modal -->
        <div class="modal-overlay" id="filterModal" onclick="closeFilterModal(event)">
            <div class="modal-drawer" onclick="event.stopPropagation()">
                <div class="drawer-handle" onclick="closeFilterModalDirect()" title="Tutup Modal"></div>
                <div id="drawerModalContent">
                    <!-- Dynamic Drawer Content -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get URL ID param if available
        const urlParams = new URLSearchParams(window.location.search);
        const orderIdParam = urlParams.get('id') || 'RTR20250000001';
        const subtitleEl = document.getElementById('pageOrderSubtitle');
        if (subtitleEl) {
            subtitleEl.textContent = orderIdParam;
        }

        const detailItemsData = [
            {
                id: 'RTR20250000001-01',
                name: 'Template Tower A',
                statusText: 'Sedang Dikirim',
                badgeClass: 'badge-dikirim',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            },
            {
                id: 'RTR20250000001-02',
                name: 'Template Tower A',
                statusText: 'Siap Karantina',
                badgeClass: 'badge-siap',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            },
            {
                id: 'RTR20250000001-03',
                name: 'Template Tower A',
                statusText: 'Sedang Karantina',
                badgeClass: 'badge-sedang',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            },
            {
                id: 'RTR20250000001-04',
                name: 'Template Tower A',
                statusText: 'Selesai Lokal',
                badgeClass: 'badge-selesai-lokal',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            },
            {
                id: 'RTR20250000001-05',
                name: 'Template Tower A',
                statusText: 'Selesai',
                badgeClass: 'badge-selesai',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            },
            {
                id: 'RTR20250000001-06',
                name: 'Template Tower',
                statusText: 'Rejected',
                badgeClass: 'badge-rejected',
                selesaiBongkar: '1 Februari 2025',
                estBerangkat: '5 Februari 2025',
                estTiba: '7 Februari 2025',
                totalSet: '4'
            }
        ];

        let selectedDetailStatusChips = [];
        let detailFilterState = {
            selesaiBongkar: '',
            estBerangkat: '',
            estTiba: '',
            totalSet: ''
        };

        function renderDetailCards(filterQuery = '') {
            const container = document.getElementById('detailCardsContainer');
            const q = filterQuery.toLowerCase().trim();

            const filtered = detailItemsData.filter(item => {
                if (q && !(item.name.toLowerCase().includes(q) || item.statusText.toLowerCase().includes(q) || item.id.toLowerCase().includes(q))) {
                    return false;
                }
                if (selectedDetailStatusChips.length > 0 && !selectedDetailStatusChips.includes(item.statusText)) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p>Tidak ada data detail karantina yang cocok.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="detail-item-card" onclick="handleActionClick('${item.id}', event)" style="cursor: pointer;" title="Klik untuk aksi karantina">
                    <div class="card-header">
                        <span class="item-title">${item.name}</span>
                        <span class="badge-status ${item.badgeClass}">${item.statusText}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="detail-label">Selesai Bongkar</span>
                            <span class="detail-val">${item.selesaiBongkar}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Est. Berangkat</span>
                            <span class="detail-val">${item.estBerangkat}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Est. Tiba</span>
                            <span class="detail-val">${item.estTiba}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Total Set</span>
                            <span class="detail-val">${item.totalSet}</span>
                        </div>
                    </div>
                    <div>
                        <button type="button" class="btn-filter-submit" onclick="handleActionClick('${item.id}', event)">Lihat Detail</button>
                    </div>
                </div>
            `).join('');
        }

        function filterDetailList(val) {
            renderDetailCards(val);
        }

        function handleActionClick(id, event) {
            if (event) event.stopPropagation();
            // Navigasi ke halaman aksi karantina berikutnya
            navigateSmooth('./karantina-action.html?id=' + encodeURIComponent(id));
        }

        function openModal() {
            document.getElementById('filterModal').classList.add('active');
        }

        function closeFilterModal(e) {
            if (e.target.id === 'filterModal') closeFilterModalDirect();
        }

        function closeFilterModalDirect() {
            document.getElementById('filterModal').classList.remove('active');
        }

        function openFilterModalDrawer() {
            const allStatuses = ['Sedang Dikirim', 'Siap Karantina', 'Sedang Karantina', 'Selesai Lokal', 'Selesai', 'Rejected'];

            const chipsHtml = allStatuses.map(status => {
                const isActive = selectedDetailStatusChips.includes(status);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleStatusChip(this, '${status}')">${status}</button>`;
            }).join('');

            document.getElementById('drawerModalContent').innerHTML = `
                <div class="filter-bottom-sheet">
                    <h2 class="filter-drawer-title">Filter</h2>
                    
                    <div class="filter-section">
                        <label class="filter-section-label">Status</label>
                        <div class="chips-container">
                            ${chipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Selesai Bongkar</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterSelesaiBongkar" class="filter-input-field" placeholder="1 Februari 2025" value="${detailFilterState.selesaiBongkar || '1 Februari 2025'}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Est. Berangkat</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterEstBerangkat" class="filter-input-field" placeholder="5 Februari 2025" value="${detailFilterState.estBerangkat || '5 Februari 2025'}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Est. Tiba</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterEstTiba" class="filter-input-field" placeholder="7 Februari 2025" value="${detailFilterState.estTiba || '7 Februari 2025'}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Total Set</label>
                        <div class="input-with-icon">
                            <select id="filterTotalSet" class="filter-input-field filter-select-field">
                                <option value="">Semua Set</option>
                                <option value="2">2 Set</option>
                                <option value="4">4 Set</option>
                                <option value="6">6 Set</option>
                            </select>
                            <i class="fa-solid fa-chevron-down input-right-icon"></i>
                        </div>
                    </div>

                    <button type="button" class="btn-filter-submit" onclick="applyDetailFilterDrawer()">Filter</button>
                </div>
            `;
            openModal();
        }

        function toggleStatusChip(btn, status) {
            btn.classList.toggle('active');
            if (selectedDetailStatusChips.includes(status)) {
                selectedDetailStatusChips = selectedDetailStatusChips.filter(s => s !== status);
            } else {
                selectedDetailStatusChips.push(status);
            }
        }

        function applyDetailFilterDrawer() {
            detailFilterState.selesaiBongkar = document.getElementById('filterSelesaiBongkar') ? document.getElementById('filterSelesaiBongkar').value.trim() : '';
            detailFilterState.estBerangkat = document.getElementById('filterEstBerangkat') ? document.getElementById('filterEstBerangkat').value.trim() : '';
            detailFilterState.estTiba = document.getElementById('filterEstTiba') ? document.getElementById('filterEstTiba').value.trim() : '';
            closeFilterModalDirect();
            renderDetailCards(document.getElementById('karantinaListSearchInput').value);
        }

        function navigateSmooth(url, event) {
            if (event) event.preventDefault();
            const container = document.querySelector('.mobile-container');
            if (container) {
                container.style.transition = 'opacity 0.12s ease-out, transform 0.12s ease-out';
                container.style.opacity = '0.9';
                container.style.transform = 'scale(0.996)';
                setTimeout(() => {
                    window.location.href = url;
                }, 100);
            } else {
                window.location.href = url;
            }
        }

        renderDetailCards();
    </script>
