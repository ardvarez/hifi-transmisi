<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERS (Tower Emergency) - Karantina Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f4f6fc;
            --card-bg: #ffffff;
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Top Header */
        .header-section {
            background: #ffffff;
            padding: 14px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .title-with-back {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }

        .back-home-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-home-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .main-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .sub-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-left: 42px;
        }

        .notif-bell-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 16px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }

        .notif-badge-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Search and Filter Section */
        .search-filter-section {
            background: #ffffff;
            padding: 10px 20px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-box {
            flex: 1;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .search-input-box:focus-within {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .search-input-box input::placeholder {
            color: #94a3b8;
        }

        .search-input-box i {
            color: #94a3b8;
            font-size: 15px;
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .filter-btn:active {
            background: #f8fafc;
        }

        /* App Body / Content Area */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-canvas);
            padding-bottom: 84px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .app-body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* ERS Card Component */
        .ers-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .ers-card:active {
            transform: scale(0.99);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-id {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        /* Status Badge Variants */
        .badge-status {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-mulai {
            background: #2563eb;
            color: #ffffff;
        }

        .badge-dikirim,
        .badge-dikarantina,
        .badge-berlangsung,
        .badge-selesai-lokal {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #ffedd5;
        }

        .badge-selesai {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        /* Card Details Rows */
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: var(--text-dark);
            font-weight: 700;
            text-align: right;
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-action {
            flex: 1;
            height: 40px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-outline {
            background: #ffffff;
            border: 1.5px solid var(--primary-blue);
            color: var(--primary-blue);
        }

        .btn-outline:active {
            background: #eff6ff;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:active {
            background: var(--primary-blue-dark);
        }

        /* Bottom Navigation Bar (4 Nav Items) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px 6px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            gap: 4px;
            text-decoration: none;
            width: 24%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item i {
            font-size: 20px;
        }

        /* iOS Bottom Bar Indicator */
        .ios-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 101;
            pointer-events: none;
        }

        /* Bottom Sheet Modal Drawer */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                        visibility 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-overlay.active .modal-drawer {
            transform: translateY(0);
        }

        .modal-drawer {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .modal-drawer::-webkit-scrollbar {
            display: none;
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 16px;
            cursor: pointer;
        }

        /* Filter Bottom Sheet Styling */
        .filter-bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .filter-drawer-title {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-section-label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            outline: none;
        }

        .chip-item.active {
            border: 1.5px solid #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        .input-with-icon {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .filter-input-field {
            width: 100%;
            height: 48px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-input-field::placeholder {
            color: #94a3b8;
        }

        .input-with-icon .filter-input-field {
            padding-right: 44px;
        }

        .filter-select-field {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .input-right-icon {
            position: absolute;
            right: 16px;
            color: #2563eb;
            font-size: 16px;
            pointer-events: none;
        }

        .btn-filter-submit {
            width: 100%;
            height: 50px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-filter-submit:active {
            background: #1d4ed8;
            transform: scale(0.99);
        }

        /* Keberangkatan Bottom Sheet Styling */
        .keberangkatan-bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .sheet-title-center {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
        }

        .sheet-desc-text {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 500;
            line-height: 1.4;
            margin-top: -6px;
            text-align: center;
        }

        .sheet-actions-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 4px;
        }

        .btn-sheet-secondary {
            width: 100%;
            height: 48px;
            background: #ffffff;
            color: #1e293b;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sheet-secondary:active {
            background: #f8fafc;
            border-color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="mobile-container">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <span>9:41 AM</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Header -->
        <div class="header-section">
            <div class="header-titles">
                <div class="title-with-back">
                    <a href="../../catalog-mobile.html" class="back-home-btn" title="Kembali ke Catalog Home">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                    <h1 class="main-title">ERS (Tower Emergency)</h1>
                </div>
                <span class="sub-title">Karantina</span>
            </div>
            <a href="../../power-inspect/notifikasi-mobile.html" class="notif-bell-btn" title="Notifikasi">
                <i class="fa-regular fa-bell"></i>
                <span class="notif-badge-dot"></span>
            </a>
        </div>

        <!-- Search & Filter Bar -->
        <div class="search-filter-section">
            <div class="search-input-box">
                <input type="text" id="karantinaSearchInput" placeholder="Cari" oninput="filterKarantina(this.value)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="filter-btn" onclick="openFilterModalDrawer()" title="Filter Data">
                <i class="fa-solid fa-filter"></i>
            </button>
        </div>

        <!-- App Body / Content Area -->
        <div class="app-body" id="karantinaContentArea">
            <!-- Injected via JavaScript -->
        </div>

        <!-- Bottom Navigation Bar (Pemasangan, Pembongkaran, Karantina, Stock Opname) -->
        <nav class="bottom-nav">
            <a href="../Pemasangan/home-mobile.html" class="nav-item" onclick="navigateSmooth('../Pemasangan/home-mobile.html', event)">
                <i class="fa-solid fa-wrench"></i>
                <span>Pemasangan</span>
            </a>
            <a href="../Pembongkaran/home-mobile.html" class="nav-item" onclick="navigateSmooth('../Pembongkaran/home-mobile.html', event)">
                <i class="fa-solid fa-truck-ramp-box"></i>
                <span>Pembongkaran</span>
            </a>
            <a href="../Karantina & Pengembalian/home-mobile.html" class="nav-item active" onclick="navigateSmooth('../Karantina & Pengembalian/home-mobile.html', event)">
                <i class="fa-solid fa-box-archive"></i>
                <span>Karantina</span>
            </a>
            <a href="../Stock Opname/home-mobile.html" class="nav-item" onclick="navigateSmooth('../Stock Opname/home-mobile.html', event)">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>Stock Opname</span>
            </a>
        </nav>

        <!-- iOS Bottom Indicator Line -->
        <div class="ios-bar"></div>

        <!-- Drawer Filter / Keberangkatan Modal -->
        <div class="modal-overlay" id="filterModal" onclick="closeFilterModal(event)">
            <div class="modal-drawer" onclick="event.stopPropagation()">
                <div class="drawer-handle" onclick="closeFilterModalDirect()" title="Tutup Modal"></div>
                <div id="drawerModalContent">
                    <!-- Dynamic Drawer Content -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const karantinaData = [
            {
                id: 'RTR20250000001',
                statusText: 'Mulai',
                badgeClass: 'badge-mulai',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: true
            },
            {
                id: 'RTR20250000002',
                statusText: 'Sedang Dikirim',
                badgeClass: 'badge-dikirim',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            },
            {
                id: 'RTR20250000003',
                statusText: 'Sedang Dikarantina',
                badgeClass: 'badge-dikarantina',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            },
            {
                id: 'RTR20250000004',
                statusText: 'Sedang Berlangsung',
                badgeClass: 'badge-berlangsung',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            },
            {
                id: 'RTR20250000005',
                statusText: 'Selesai Lokal',
                badgeClass: 'badge-selesai-lokal',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            },
            {
                id: 'RTR20250000006',
                statusText: 'Selesai',
                badgeClass: 'badge-selesai',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            },
            {
                id: 'RTR20250000007',
                statusText: 'Rejected',
                badgeClass: 'badge-rejected',
                estBerangkat: '1 Februari 2025',
                estTiba: '1 Februari 2025',
                jumlahTE: '2',
                merk: 'Lindsay, Tower Solution',
                hasKeberangkatan: false
            }
        ];

        let selectedStatusChips = [];
        let filterState = {
            permit: '',
            estBerangkat: '',
            estTiba: '',
            merk: ''
        };

        function renderKarantinaCards(filterQuery = '') {
            const container = document.getElementById('karantinaContentArea');
            const q = filterQuery.toLowerCase().trim();

            const filtered = karantinaData.filter(item => {
                if (q && !(item.id.toLowerCase().includes(q) || item.statusText.toLowerCase().includes(q) || item.merk.toLowerCase().includes(q))) {
                    return false;
                }
                if (selectedStatusChips.length > 0 && !selectedStatusChips.includes(item.statusText)) {
                    return false;
                }
                if (filterState.permit && !item.id.toLowerCase().includes(filterState.permit.toLowerCase())) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p>Tidak ada data karantina yang cocok dengan kriteria pencarian.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                let actionHtml = '';
                if (item.hasKeberangkatan) {
                    actionHtml = `
                        <div class="card-actions">
                            <button type="button" class="btn-action btn-outline" onclick="handleDetailClick('${item.id}', event)">Lihat Detail</button>
                            <button type="button" class="btn-action btn-primary" onclick="openKeberangkatanModal('${item.id}', event)">Keberangkatan</button>
                        </div>
                    `;
                } else if (item.statusText === 'Sedang Dikirim') {
                    actionHtml = `
                        <div class="card-actions">
                            <button type="button" class="btn-action btn-outline" onclick="handleDetailClick('${item.id}', event)">Lihat Detail</button>
                            <button type="button" class="btn-action btn-primary" onclick="openKedatanganModalHome('${item.id}', event)">Kedatangan</button>
                        </div>
                    `;
                } else {
                    actionHtml = `
                        <div class="card-actions">
                            <button type="button" class="btn-action btn-primary" style="width: 100%;" onclick="handleDetailClick('${item.id}', event)">Lihat Detail</button>
                        </div>
                    `;
                }

                return `
                    <div class="ers-card" onclick="handleDetailClick('${item.id}', event)" style="cursor: pointer;">
                        <div class="card-header">
                            <span class="card-id">${item.id}</span>
                            <span class="badge-status ${item.badgeClass}">${item.statusText}</span>
                        </div>
                        <div class="card-details">
                            <div class="detail-row">
                                <span class="detail-label">Est. Berangkat</span>
                                <span class="detail-val">${item.estBerangkat}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Est. Tiba</span>
                                <span class="detail-val">${item.estTiba}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Jumlah TE</span>
                                <span class="detail-val">${item.jumlahTE}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Merk</span>
                                <span class="detail-val">${item.merk}</span>
                            </div>
                        </div>
                        <div onclick="event.stopPropagation()">
                            ${actionHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterKarantina(val) {
            renderKarantinaCards(val);
        }

        function handleDetailClick(id, event) {
            if (event) event.stopPropagation();
            // Navigasi ke halaman detail karantina jika ada
            navigateSmooth('./list-karantina.html?id=' + encodeURIComponent(id));
        }

        function openModal() {
            document.getElementById('filterModal').classList.add('active');
        }

        function closeFilterModal(e) {
            if (e.target.id === 'filterModal') closeFilterModalDirect();
        }

        function closeFilterModalDirect() {
            document.getElementById('filterModal').classList.remove('active');
        }

        /* Filter Bottom Sheet */
        function openFilterModalDrawer() {
            const allStatuses = ['Mulai', 'Sedang Dikirim', 'Sedang Dikarantina', 'Sedang Berlangsung', 'Selesai Lokal', 'Selesai', 'Rejected'];

            const chipsHtml = allStatuses.map(status => {
                const isActive = selectedStatusChips.includes(status);
                return `<button type="button" class="chip-item ${isActive ? 'active' : ''}" onclick="toggleStatusChip(this, '${status}')">${status}</button>`;
            }).join('');

            document.getElementById('drawerModalContent').innerHTML = `
                <div class="filter-bottom-sheet">
                    <h2 class="filter-drawer-title">Filter</h2>
                    
                    <div class="filter-section">
                        <label class="filter-section-label">Status</label>
                        <div class="chips-container">
                            ${chipsHtml}
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">No. Permit / Dokumen</label>
                        <input type="text" id="filterNoPermit" class="filter-input-field" placeholder="Masukkan No. Permit" value="${filterState.permit || ''}">
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Est. Berangkat</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterEstBerangkat" class="filter-input-field" placeholder="1 Februari 2025" value="${filterState.estBerangkat || '1 Februari 2025'}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Tanggal Est. Tiba</label>
                        <div class="input-with-icon">
                            <input type="text" id="filterEstTiba" class="filter-input-field" placeholder="1 Februari 2025" value="${filterState.estTiba || '1 Februari 2025'}">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-section-label">Merk ERS</label>
                        <div class="input-with-icon">
                            <select id="filterMerk" class="filter-input-field filter-select-field">
                                <option value="">Semua Merk</option>
                                <option value="Lindsay">Lindsay</option>
                                <option value="Tower Solution">Tower Solution</option>
                                <option value="SBB">SBB</option>
                            </select>
                            <i class="fa-solid fa-chevron-down input-right-icon"></i>
                        </div>
                    </div>

                    <button type="button" class="btn-filter-submit" onclick="applyFilterDrawer()">Filter</button>
                </div>
            `;
            openModal();
        }

        function toggleStatusChip(btn, status) {
            btn.classList.toggle('active');
            if (selectedStatusChips.includes(status)) {
                selectedStatusChips = selectedStatusChips.filter(s => s !== status);
            } else {
                selectedStatusChips.push(status);
            }
        }

        function applyFilterDrawer() {
            filterState.permit = document.getElementById('filterNoPermit') ? document.getElementById('filterNoPermit').value.trim() : '';
            filterState.estBerangkat = document.getElementById('filterEstBerangkat') ? document.getElementById('filterEstBerangkat').value.trim() : '';
            filterState.estTiba = document.getElementById('filterEstTiba') ? document.getElementById('filterEstTiba').value.trim() : '';
            closeFilterModalDirect();
            renderKarantinaCards(document.getElementById('karantinaSearchInput').value);
        }

        /* Keberangkatan Modal */
        function openKeberangkatanModal(id, event) {
            if (event) event.stopPropagation();
            document.getElementById('drawerModalContent').innerHTML = `
                <div class="keberangkatan-bottom-sheet">
                    <h2 class="sheet-title-center">Keberangkatan Karantina ERS</h2>
                    <p class="sheet-desc-text">Apakah material <strong>${id}</strong> sudah diberangkatkan ke lokasi karantina?</p>

                    <div class="filter-section" style="text-align: left; margin-top: 4px;">
                        <label class="filter-section-label">Waktu Berangkat</label>
                        <div class="input-with-icon">
                            <input type="text" id="waktuBerangkatKarantina" class="filter-input-field" value="1 Februari 2025, 09:30" placeholder="Pilih Tanggal & Waktu">
                            <i class="fa-regular fa-calendar input-right-icon"></i>
                        </div>
                    </div>

                    <div class="sheet-actions-stack">
                        <button type="button" class="btn-filter-submit" onclick="submitKeberangkatan('${id}')">Submit</button>
                        <button type="button" class="btn-sheet-secondary" onclick="closeFilterModalDirect()">Kembali</button>
                    </div>
                </div>
            `;
            openModal();
        }

        function submitKeberangkatan(id) {
            const item = karantinaData.find(d => d.id === id);
            if (item) {
                item.statusText = 'Sedang Dikirim';
                item.badgeClass = 'badge-dikirim';
                item.hasKeberangkatan = false;
            }
            closeFilterModalDirect();
            renderKarantinaCards(document.getElementById('karantinaSearchInput').value);
        }

        function openKedatanganModalHome(id, event) {
            if (event) event.stopPropagation();
            document.getElementById('drawerModalContent').innerHTML = `
                <div class="keberangkatan-bottom-sheet">
                    <h2 class="sheet-title-center">Kedatangan</h2>
                    <p class="sheet-desc-text">Apakah anda yakin ingin konfirmasi kedatangan material <strong>${id}</strong>?</p>
                    
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; text-align: left; margin: 4px 0;">
                        <div style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Waktu Kedatangan</div>
                        <div style="font-size: 14px; font-weight: 800; color: #0f172a; margin-top: 2px;">10 Januari 2025, 10:45 WIB</div>
                    </div>

                    <div class="sheet-actions-stack">
                        <button type="button" class="btn-filter-submit" onclick="submitKedatanganHome('${id}')">Konfirmasi Kedatangan</button>
                        <button type="button" class="btn-sheet-secondary" onclick="closeFilterModalDirect()">Kembali</button>
                    </div>
                </div>
            `;
            openModal();
        }

        function submitKedatanganHome(id) {
            const item = karantinaData.find(d => d.id === id);
            if (item) {
                item.statusText = 'Siap Karantina';
                item.badgeClass = 'badge-siap';
            }
            closeFilterModalDirect();
            renderKarantinaCards(document.getElementById('karantinaSearchInput').value);
        }

        function navigateSmooth(url, event) {
            if (event) event.preventDefault();
            const container = document.querySelector('.mobile-container');
            if (container) {
                container.style.transition = 'opacity 0.12s ease-out, transform 0.12s ease-out';
                container.style.opacity = '0.9';
                container.style.transform = 'scale(0.996)';
                setTimeout(() => {
                    window.location.href = url;
                }, 100);
            } else {
                window.location.href = url;
            }
        }

        renderKarantinaCards();
    </script>
