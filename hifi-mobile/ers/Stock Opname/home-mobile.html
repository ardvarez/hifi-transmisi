<!DOCTYPE html>

    <title>ERS (Tower Emergency) - Stock Opname Mobile</title>

    <style>
        :root {
            --bg-canvas: #f4f6fc;
            --card-bg: #ffffff;
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            animation: pageFadeIn 0.2s ease-out;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0.9;
                transform: scale(0.996);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (min-width: 440px) {
            .mobile-container {
                height: 870px;
                max-height: 94vh;
                border-radius: 40px;
                border: 8px solid #1e293b;
            }
        }

        /* iOS Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            background-color: #ffffff;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Top Header */
        .header-section {
            background: #ffffff;
            padding: 14px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .title-with-back {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }

        .back-home-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-home-btn:hover {
            background: #e2e8f0;
            color: var(--primary-blue);
        }

        .main-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .sub-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-left: 42px;
        }

        .notif-bell-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 16px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }

        .notif-badge-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Search and Filter Section */
        .search-filter-section {
            background: #ffffff;
            padding: 10px 20px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-box {
            flex: 1;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .search-input-box:focus-within {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .search-input-box input::placeholder {
            color: #94a3b8;
        }

        .search-input-box i {
            color: #94a3b8;
            font-size: 15px;
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        /* App Body / Content Area */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-canvas);
            padding-bottom: 24px;
            scrollbar-width: none;
        }

        .app-body::-webkit-scrollbar {
            display: none;
        }

        /* Data Card Styling */
        .ers-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: transform 0.2s;
        }

        .ers-card:active {
            transform: scale(0.99);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .card-id {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        /* Status Badge Variants */
        .badge-status {
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .badge-mulai {
            background: #2563eb;
            color: #ffffff;
        }

        .badge-dikirim {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #ffedd5;
        }

        .badge-server {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* Card Details Rows */
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Card Actions */
        .card-actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-outline {
            background: #ffffff;
            border: 1.5px solid #2563eb;
            color: #2563eb;
        }

        .btn-primary {
            background: #2563eb;
            border: 1.5px solid #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* Bottom Navigation Bar */
        

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            gap: 4px;
            text-decoration: none;
            width: 24%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item i {
            font-size: 20px;
        }

        /* iOS Bottom Bar Line */
        .ios-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #000000;
            border-radius: 2px;
            z-index: 101;
        }

        /* Smooth Drawer Filter Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1),
                        visibility 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay.active .modal-drawer {
            transform: translateY(0);
        }

        .modal-drawer {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .btn-filter-submit {
            width: 100%;
            height: 50px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

    <script>
        const opnameData = [
            {
                id: 'STK20250000001',
                statusText: 'Draft Opname',
                badgeClass: 'badge-mulai',
                periode: 'Q1 2025',
                totalUnit: '12 Unit ERS',
                lokasi: 'Gudang Pusat Semarang',
                rightBtnText: 'Mulai Cek'
            },
            {
                id: 'STK20250000002',
                statusText: 'Proses Verifikasi',
                badgeClass: 'badge-dikirim',
                periode: 'Q1 2025',
                totalUnit: '18 Unit ERS',
                lokasi: 'Gudang UPT Ungaran',
                rightBtnText: 'Verifikasi'
            },
            {
                id: 'STK20250000003',
                statusText: 'Approved Opname',
                badgeClass: 'badge-server',
                periode: 'Q4 2024',
                totalUnit: '24 Unit ERS',
                lokasi: 'Gudang UPT Weleri',
                rightBtnText: 'Lihat Detail'
            }
        ];

        function renderCards(filterQuery = '') {
            const container = document.getElementById('ersContentArea');
            const q = filterQuery.toLowerCase().trim();
            const filtered = opnameData.filter(item => !q || item.id.toLowerCase().includes(q) || item.statusText.toLowerCase().includes(q));

            container.innerHTML = filtered.map(item => `
                <div class="ers-card">
                    <div class="card-header">
                        <span class="card-id">${item.id}</span>
                        <span class="badge-status ${item.badgeClass}">${item.statusText}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="detail-label">Periode Opname</span>
                            <span class="detail-val">${item.periode}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Total Material</span>
                            <span class="detail-val">${item.totalUnit}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Lokasi Gudang</span>
                            <span class="detail-val">${item.lokasi}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-outline" onclick="closeFilterModalDirect()">Rincian Stok</button>
                        <button class="btn-action btn-primary" onclick="closeFilterModalDirect()">${item.rightBtnText}</button>
                    </div>
                </div>
            `).join('');
        }

        function filterData(val) { renderCards(val); }
        function openFilterModal() { document.getElementById('filterModal').classList.add('active'); }
        function closeFilterModal(e) { if (e.target.id === 'filterModal') closeFilterModalDirect(); }
        function closeFilterModalDirect() { document.getElementById('filterModal').classList.remove('active'); }

        function navigateSmooth(url, event) {
            if (event) event.preventDefault();
            const container = document.querySelector('.mobile-container');
            if (container) {
                container.style.transition = 'opacity 0.12s ease-out, transform 0.12s ease-out';
                container.style.opacity = '0.9';
                container.style.transform = 'scale(0.996)';
                setTimeout(() => {
                    window.location.href = url;
                }, 100);
            } else {
                window.location.href = url;
            }
        }

        renderCards();
    </script>
