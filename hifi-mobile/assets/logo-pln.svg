<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="100%" height="100%">
  <!-- Official PLN Emblem -->
  <g transform="translate(10, 8)">
    <!-- Yellow Rectangle Badge with slight rounded corners -->
    <rect x="0" y="0" width="60" height="74" rx="10" fill="#ffd200"/>
    
    <!-- 3 Blue Wavy Lines (Water / Hydro / Grid Energy) -->
    <path d="M 8 36 C 14 32, 20 40, 26 36 C 32 32, 38 40, 44 36 C 48 33, 50 36, 52 36" fill="none" stroke="#0099da" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8 44 C 14 40, 20 48, 26 44 C 32 40, 38 48, 44 44 C 48 41, 50 44, 52 44" fill="none" stroke="#0099da" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8 52 C 14 48, 20 56, 26 52 C 32 48, 38 56, 44 52 C 48 49, 50 52, 52 52" fill="none" stroke="#0099da" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Red Lightning Bolt (Electricity) -->
    <polygon points="32,8 20,38 31,38 23,66 46,32 34,32" fill="#e31e24"/>
  </g>
  
  <!-- Official Text: PLN -->
  <text x="84" y="56" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" fill="#0099da" letter-spacing="1.5">PLN</text>
</svg>
