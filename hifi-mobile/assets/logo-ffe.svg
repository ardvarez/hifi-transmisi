<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ffeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8e8" />
      <stop offset="100%" stop-color="#004e8c" />
    </linearGradient>
    <linearGradient id="ffeYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <g transform="translate(180, 110)">
    <!-- 1. Gear (Cogwheel) Top -->
    <g transform="translate(0, -50)">
      <!-- Cog Teeth -->
      <path d="M -10 -42 L 10 -42 L 8 -32 L -8 -32 Z
               M 24 -36 L 38 -22 L 30 -16 L 20 -26 Z
               M 42 -10 L 42 10 L 32 8 L 32 -8 Z
               M 38 22 L 24 36 L 16 28 L 26 18 Z
               M 10 42 L -10 42 L -8 32 L 8 32 Z
               M -24 36 L -38 22 L -30 16 L -20 28 Z
               M -42 10 L -42 -10 L -32 -8 L -32 8 Z
               M -38 -22 L -24 -36 L -16 -28 L -28 -18 Z" fill="#0077b6"/>
      <circle cx="0" cy="0" r="34" fill="#0077b6"/>
      <circle cx="0" cy="0" r="25" fill="#ffffff"/>
      
      <!-- Speech Bubble Hexagon with Arrow -->
      <polygon points="0,-22 20,-10 20,12 0,24 -20,12 -20,-10" fill="url(#ffeYellowGrad)"/>
      <!-- Inner White Bubble -->
      <polygon points="0,-16 14,-7 14,8 0,17 -14,8 -14,-7" fill="#ffffff"/>
      <!-- Cyan Arrow pointing Up-Right -->
      <path d="M -7 9 L 6 -4 M 6 -4 L 0 -5 M 6 -4 L 5 2" fill="none" stroke="#0077b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="7,-5 0,-6 6,1" fill="#0077b6"/>
    </g>

    <!-- 2. SUTT Tower Structure behind & integrated with FFE -->
    <!-- Left Blue Tower Leg & Crossarms -->
    <path d="M 0 -18 L -36 50 L -24 50 L 0 0" fill="none" stroke="#0096c7" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-44" y2="0" stroke="#0096c7" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-36" y1="0" x2="-36" y2="12" stroke="#0096c7" stroke-width="3"/>
    <line x1="-42" y1="0" x2="-42" y2="12" stroke="#0096c7" stroke-width="3"/>
    
    <!-- Right Yellow Tower Leg & Crossarms -->
    <path d="M 0 -18 L 36 50 L 24 50 L 0 0" fill="none" stroke="#ffb703" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="44" y2="0" stroke="#ffb703" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="36" y1="0" x2="36" y2="12" stroke="#ffb703" stroke-width="3"/>
    <line x1="42" y1="0" x2="42" y2="12" stroke="#ffb703" stroke-width="3"/>

    <!-- Tower Lattice Diagonals -->
    <line x1="0" y1="0" x2="-18" y2="24" stroke="#0096c7" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="18" y2="24" stroke="#ffb703" stroke-width="3.5"/>
    <line x1="-18" y1="24" x2="18" y2="24" stroke="#0077b6" stroke-width="3"/>
    <line x1="-18" y1="24" x2="0" y2="48" stroke="#0096c7" stroke-width="3"/>
    <line x1="18" y1="24" x2="0" y2="48" stroke="#ffb703" stroke-width="3"/>

    <!-- Stylized Emblem Letters -->
    <!-- Left F (Blue) -->
    <path d="M -72 30 L -46 30 L -46 42 L -60 42 L -60 52 L -48 52 L -48 64 L -60 64 L -60 90 L -72 90 Z" fill="url(#ffeBlueGrad)"/>
    
    <!-- Right E (Yellow/Blue gradient) -->
    <path d="M 46 30 L 72 30 L 72 42 L 58 42 L 58 52 L 68 52 L 68 64 L 58 64 L 58 78 L 72 78 L 72 90 L 46 90 Z" fill="url(#ffeBlueGrad)"/>
    <path d="M 46 30 L 72 30 L 72 42 L 58 42 L 58 52 L 68 52 L 68 64 L 46 64 Z" fill="url(#ffeYellowGrad)"/>

    <!-- Center Yellow Lightning Connector -->
    <polygon points="-24,62 8,28 -2,46 22,22 4,68 14,50" fill="url(#ffeYellowGrad)"/>
  </g>

  <!-- Main Bold Typography "FFE" -->
  <g fill="url(#ffeBlueGrad)">
    <!-- F -->
    <path d="M 52 230 L 102 230 C 114 230 120 236 120 246 L 120 252 C 120 258 116 262 110 264 L 84 264 L 84 274 L 104 274 C 110 274 114 278 114 284 L 114 288 C 114 294 110 298 104 298 L 84 298 L 84 330 L 52 330 Z"/>
    
    <!-- F -->
    <path d="M 136 230 L 186 230 C 198 230 204 236 204 246 L 204 252 C 204 258 200 262 194 264 L 168 264 L 168 274 L 188 274 C 194 274 198 278 198 284 L 198 288 C 198 294 194 298 188 298 L 168 298 L 168 330 L 136 330 Z"/>
    
    <!-- E -->
    <path d="M 220 230 L 270 230 C 282 230 288 236 288 246 L 288 252 C 288 258 284 262 278 264 L 252 264 L 252 274 L 272 274 C 278 274 282 278 282 284 L 282 288 C 282 294 278 298 272 298 L 252 298 L 252 308 L 278 308 C 284 308 288 312 288 318 L 288 322 C 288 328 282 330 270 330 L 220 330 Z"/>
  </g>

  <!-- Subtitle: FORUM FEEDBACK ENGINEERING -->
  <text x="180" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" fill="#092244" letter-spacing="0.5">FORUM FEEDBACK ENGINEERING</text>
</svg>
