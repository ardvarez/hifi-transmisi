<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 140" width="100%" height="100%">
  <!-- Power Swift Hexagon Icon Mark -->
  <g transform="translate(10, 8)">
    <defs>
      <clipPath id="psHexMarkClip">
        <polygon points="60,2 118,34 118,98 60,130 2,98 2,34" />
      </clipPath>
    </defs>
    <!-- Hexagon Split Background -->
    <g clip-path="url(#psHexMarkClip)">
      <!-- Left Teal -->
      <rect x="0" y="0" width="60" height="132" fill="#00799e"/>
      <!-- Right Orange -->
      <rect x="60" y="0" width="60" height="132" fill="#f3781f"/>
      
      <!-- Tower Structure Left -->
      <path d="M 60 10 L 6 72 L 40 72 L 60 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="60" y1="36" x2="20" y2="46" stroke="#ffffff" stroke-width="4"/>
      <line x1="60" y1="56" x2="30" y2="60" stroke="#ffffff" stroke-width="4"/>
      <line x1="60" y1="46" x2="30" y2="60" stroke="#ffffff" stroke-width="3"/>
      <line x1="60" y1="36" x2="40" y2="72" stroke="#ffffff" stroke-width="3"/>
      <!-- Insulator string -->
      <rect x="16" y="46" width="10" height="8" rx="2" fill="#ffffff"/>
      
      <!-- Right Tower Crossarms & Lattice -->
      <line x1="60" y1="36" x2="104" y2="46" stroke="#004880" stroke-width="4"/>
      <line x1="60" y1="56" x2="90" y2="60" stroke="#004880" stroke-width="4"/>
      <rect x="94" y="46" width="10" height="8" rx="2" fill="#004880"/>
      
      <!-- Tower Lattice Grid Orange Side -->
      <polygon points="60,14 74,36 60,36" fill="#fdb813"/>
      <polygon points="60,36 82,56 60,56" fill="#fdb813"/>
      <polygon points="60,56 94,78 60,78" fill="#004880"/>

      <!-- Lightning Bolt on Right Side extending downwards -->
      <polygon points="60,28 78,64 64,64 78,98 52,126 58,80 44,80" fill="#ffffff"/>
      <polygon points="60,34 74,62 62,62 72,92 56,118 58,82 48,82" fill="#00799e"/>
    </g>
  </g>
  
  <!-- Text: POWER SWIFT -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900">
    <text x="142" y="58" font-size="44" fill="#004880" letter-spacing="1">POWER</text>
    <text x="142" y="104" font-size="44" fill="#f3781f" letter-spacing="1">SWIFT</text>
  </g>
</svg>
