<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 100" width="100%" height="100%">
  <!-- TRANSMISSION ONE by [PLN Logo] PLN -->
  <g transform="translate(10, 20)">
    <!-- TRANSMISSION ONE Text -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#00578a" letter-spacing="0.5">TRANSMISSION ONE</text>
    
    <!-- by Text -->
    <text x="502" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#00578a">by</text>
    
    <!-- PLN Circular Emblem Badge -->
    <g transform="translate(546, 12)">
      <!-- Yellow Circle -->
      <circle cx="28" cy="28" r="26" fill="#ffd100"/>
      
      <!-- Blue Waves (3 wavy lines) -->
      <path d="M 12 24 Q 18 21 24 24 T 36 24 T 44 24" fill="none" stroke="#00a2e8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 12 29 Q 18 26 24 29 T 36 29 T 44 29" fill="none" stroke="#00a2e8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 12 34 Q 18 31 24 34 T 36 34 T 44 34" fill="none" stroke="#00a2e8" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Red Lightning Bolt -->
      <polygon points="28,8 20,27 27,27 23,48 37,25 30,25" fill="#eb1c24"/>
    </g>
    
    <!-- PLN Blue Text -->
    <text x="614" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="900" fill="#00a2e8" letter-spacing="1.5">PLN</text>
  </g>
</svg>
