<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dashBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a2e8" />
      <stop offset="100%" stop-color="#00578a" />
    </linearGradient>
    <linearGradient id="dashGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd100" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="dashBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4884" />
      <stop offset="100%" stop-color="#072a54" />
    </linearGradient>
    <filter id="dashShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00578a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dashboard Monogram & Gauge Emblem Mark -->
  <g transform="translate(12, 12)">
    <!-- Rounded Emblem Container -->
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#dashBgGrad)" filter="url(#dashShadow)"/>
    
    <!-- Outer Gauge Track Arc -->
    <path d="M 22 68 A 32 32 0 1 1 74 68" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
    <path d="M 22 68 A 32 32 0 0 1 68 22" fill="none" stroke="url(#dashGoldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Bar Chart Analytics Vectors -->
    <!-- Bar 1 -->
    <rect x="28" y="50" width="8" height="24" rx="3" fill="#00a2e8"/>
    <!-- Bar 2 -->
    <rect x="42" y="36" width="8" height="38" rx="3" fill="url(#dashGoldGrad)"/>
    <!-- Bar 3 -->
    <rect x="56" y="24" width="8" height="50" rx="3" fill="#38bdf8"/>

    <!-- Dynamic Trend Line & Spark -->
    <path d="M 24 54 Q 44 42 62 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="20" r="4.5" fill="#ffffff"/>
    <circle cx="62" cy="20" r="2.5" fill="#0b4884"/>

    <!-- Yellow Accent Indicator Dot -->
    <rect x="80" y="4" width="10" height="10" rx="3" fill="url(#dashGoldGrad)"/>
  </g>

  <!-- Typography Brand: DASHBOARD -->
  <g font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif">
    <!-- Subtitle Category Above -->
    <text x="124" y="32" font-size="11.5" font-weight="800" fill="#0284c7" letter-spacing="3.5">TRANSMISI</text>
    
    <!-- Main App Title -->
    <text x="122" y="68" font-size="34" font-weight="900" fill="#0b4884" letter-spacing="0.5">DASHBOARD</text>
    
    <!-- Sub-label below -->
    <text x="124" y="90" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">EXECUTIVE ANALYTICS</text>
    
    <!-- Decorative PLN Gold underline / pill accent -->
    <rect x="124" y="98" width="46" height="3.5" rx="1.75" fill="#f59e0b"/>
  </g>
</svg>
