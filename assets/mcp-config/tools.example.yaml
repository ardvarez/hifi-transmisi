# TEMPLATE CONFIGURATION MCP SERVER (SAFE FOR GITHUB)
# Salin file ini menjadi `tools.yaml` dan isi kredensial asli Anda di `tools.yaml`.

mcpServers:
  alloydb-postgres:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-postgres"
      - "postgresql://<USER>:<PASSWORD>@<HOST>:<PORT>/<DATABASE>"
    env:
      PGHOST: "<HOST>"
      PGPORT: "<PORT>"
      PGUSER: "<USER>"
      PGPASSWORD: "<PASSWORD>"
      PGDATABASE: "<DATABASE>"
