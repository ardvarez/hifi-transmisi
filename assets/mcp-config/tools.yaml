# Configuration MCP Server untuk AlloyDB / PostgreSQL
# Menggunakan official PostgreSQL MCP Server (@modelcontextprotocol/server-postgres)
# AlloyDB 100% kompatibel dengan PostgreSQL protocol

mcpServers:
  alloydb-postgres:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-postgres"
      - "postgresql://postgres:YOUR_PASSWORD@localhost:5432/postgres"
    env:
      PGHOST: "localhost"
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: "YOUR_PASSWORD"
      PGDATABASE: "postgres"

# Catatan Penggunaan:
# 1. Ganti `YOUR_PASSWORD`, `localhost`, `5432`, dan `postgres` dengan kredensial AlloyDB Anda.
# 2. Jika menggunakan AlloyDB di Google Cloud Platform (GCP) dengan Auth Proxy:
#    Ganti host ke 127.0.0.1 (setelah alloydb-auth-proxy dijalankan).
